<body>
    <div class="page-header">
        <div>
            <a href="FACE APP.html">←</a>
            <div style="display:inline-block; vertical-align: middle; margin-left: 12px;">
                <h1 class="page-title">Project</h1>
                <p class="subtitle">প্রজেক্টের তথ্য এডিট এবং দেখুন</p>
            </div>
        </div>
        <button class="btn-add" onclick="addRow()">নতুন প্রজেক্ট যোগ করুন</button>
    </div>

    <div class="content">
        <div class="summary-card">
            <div class="summary-grid">
                <div class="stat-box">
                    <div class="stat-title">মোট প্রজেক্ট</div>
                    <div class="stat-value" id="totalProjects">৩</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">চলমান</div>
                    <div class="stat-value" id="activeProjects">২</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">সম্পন্ন</div>
                    <div class="stat-value" id="completedProjects">১</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">মোট বাজেট</div>
                    <div class="stat-value" id="totalBudget">৳ ৫০০০০</div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="action-bar">
                <span>প্রজেক্টের তথ্য</span>
                <button class="btn-refresh" onclick="renderTable()">রিফ্রেশ</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>নাম</th>
                        <th>বর্ণনা</th>
                        <th>বাজেট</th>
                        <th>স্ট্যাটাস</th>
                        <th>শুরু তারিখ</th>
                        <th>শেষ তারিখ</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="projectBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">কোনো প্রজেক্টের তথ্য নেই, নতুন যোগ করুন।</div>
        </div>
    </div>

    <script>
        const projectData = [
            { name: 'Website Development', description: 'Build a new website', budget: 20000, status: 'Active', startDate: '2024-01-01', endDate: '2024-06-01' },
            { name: 'Mobile App', description: 'Develop mobile application', budget: 15000, status: 'Active', startDate: '2024-02-01', endDate: '2024-08-01' },
            { name: 'Marketing Campaign', description: 'Social media campaign', budget: 15000, status: 'Completed', startDate: '2024-01-15', endDate: '2024-03-15' }
        ];
        let editIndex = null;

        function renderTable() {
            const tbody = document.getElementById('projectBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (projectData.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            projectData.forEach((row, index) => {
                const tr = document.createElement('tr');

                if (editIndex === index) {
                    tr.innerHTML = `
                        <td><input type="text" value="${row.name}" id="name-${index}"></td>
                        <td><input type="text" value="${row.description}" id="description-${index}"></td>
                        <td><input type="number" min="0" value="${row.budget}" id="budget-${index}"></td>
                        <td>
                            <select id="status-${index}">
                                <option value="Active" ${row.status === 'Active' ? 'selected' : ''}>Active</option>
                                <option value="Completed" ${row.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                <option value="On Hold" ${row.status === 'On Hold' ? 'selected' : ''}>On Hold</option>
                            </select>
                        </td>
                        <td><input type="date" value="${row.startDate}" id="startDate-${index}"></td>
                        <td><input type="date" value="${row.endDate}" id="endDate-${index}"></td>
                        <td class="row-action">
                            <button class="btn-save" onclick="saveRow(${index})">Save</button>
                            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                        </td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${row.name}</td>
                        <td>${row.description}</td>
                        <td>৳ ${row.budget}</td>
                        <td><span class="tag ${row.status === 'Completed' ? 'tag-completed' : 'tag-active'}">${row.status}</span></td>
                        <td>${row.startDate}</td>
                        <td>${row.endDate}</td>
                        <td class="row-action">
                            <button class="btn-edit" onclick="editRow(${index})">Edit</button>
                            <button class="btn-delete" onclick="deleteRow(${index})">Delete</button>
                        </td>
                    `;
                }

                tbody.appendChild(tr);
            });

            updateSummary();
        }

        function updateSummary() {
            const totalProjects = projectData.length;
            const activeProjects = projectData.filter(row => row.status === 'Active').length;
            const completedProjects = projectData.filter(row => row.status === 'Completed').length;
            const totalBudget = projectData.reduce((sum, row) => sum + row.budget, 0);

            document.getElementById('totalProjects').innerText = totalProjects;
            document.getElementById('activeProjects').innerText = activeProjects;
            document.getElementById('completedProjects').innerText = completedProjects;
            document.getElementById('totalBudget').innerText = `৳ ${totalBudget}`;
        }

        function editRow(index) {
            editIndex = index;
            renderTable();
        }

        function cancelEdit() {
            editIndex = null;
            renderTable();
        }

        function saveRow(index) {
            const name = document.getElementById(`name-${index}`).value.trim();
            const description = document.getElementById(`description-${index}`).value.trim();
            const budget = Number(document.getElementById(`budget-${index}`).value);
            const status = document.getElementById(`status-${index}`).value;
            const startDate = document.getElementById(`startDate-${index}`).value;
            const endDate = document.getElementById(`endDate-${index}`).value;

            if (!name || !description || budget <= 0 || !startDate) {
                alert('সব ফিল্ড পূরণ করুন এবং বাজেট ০-এর বেশি হতে হবে।');
                return;
            }

            projectData[index] = { name, description, budget, status, startDate, endDate };
            editIndex = null;
            renderTable();
        }

        function deleteRow(index) {
            if (!confirm('এই প্রজেক্টের তথ্য মুছে ফেলতে চান?')) return;
            projectData.splice(index, 1);
            if (editIndex === index) editIndex = null;
            renderTable();
        }

        function addRow() {
            projectData.push({ name: 'New Project', description: 'Project description', budget: 0, status: 'Active', startDate: new Date().toISOString().split('T')[0], endDate: '' });
            editIndex = projectData.length - 1;
            renderTable();
        }

        renderTable();
    </script>
