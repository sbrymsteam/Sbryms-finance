<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBRYMS Finance - Donation</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f3f4f6; color: #1f2937; }
        .page-header { background: #df146e; color: white; padding: 22px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
        .page-header a { color: white; text-decoration: none; font-size: 22px; }
        .page-title { margin: 0; font-size: 20px; font-weight: 700; }
        .subtitle { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .content { padding: 20px; }
        .summary-card { background: white; border-radius: 18px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 18px; }
        .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .stat-box { background: #f8fafc; border-radius: 15px; padding: 16px; }
        .stat-title { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
        .stat-value { font-size: 20px; font-weight: 700; color: #111827; }
        .action-bar { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 16px; }
        .action-bar button { border: none; border-radius: 14px; padding: 12px 16px; font-weight: 700; cursor: pointer; }
        .btn-add { background: #10b981; color: white; }
        .btn-refresh { background: #3b82f6; color: white; }
        .table-card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; }
        th { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .1em; border-bottom: 1px solid #e5e7eb; background: #f8fafc; position: sticky; top: 0; z-index: 1; }
        tbody tr:nth-child(even) { background: #fafafa; }
        tbody tr:hover { background: #f3f4f6; }
        td { border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
        .tag { display: inline-flex; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .tag-donation { background: #fef3c7; color: #d97706; }
        .row-action button { margin-right: 6px; padding: 7px 10px; border: none; border-radius: 12px; cursor: pointer; font-size: 12px; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-save { background: #10b981; color: white; }
        .btn-cancel { background: #9ca3af; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        input, select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 14px; }
        .empty-state { text-align: center; padding: 32px 0; color: #6b7280; }
    </style>
</head>
<body>
    <div class="page-header">
        <div>
            <a href="FACE APP.html">←</a>
            <div style="display:inline-block; vertical-align: middle; margin-left: 12px;">
                <h1 class="page-title">Donation</h1>
                <p class="subtitle">দানের তথ্য এডিট এবং দেখুন</p>
            </div>
        </div>
        <button class="btn-add" onclick="addRow()">নতুন দান যোগ করুন</button>
    </div>

    <div class="content">
        <div class="summary-card">
            <div class="summary-grid">
                <div class="stat-box">
                    <div class="stat-title">মোট দান</div>
                    <div class="stat-value" id="totalDonation">৳ ৫০০০</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">এই মাসে</div>
                    <div class="stat-value" id="monthlyDonation">৳ ২০০০</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">প্রাপক</div>
                    <div class="stat-value" id="recipientsCount">৩</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">গড় দান</div>
                    <div class="stat-value" id="avgDonation">৳ ১৬৬৭</div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="action-bar">
                <span>দানের তথ্য</span>
                <button class="btn-refresh" onclick="renderTable()">রিফ্রেশ</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ</th>
                        <th>প্রাপক</th>
                        <th>পরিমাণ</th>
                        <th>কারণ</th>
                        <th>পেমেন্ট মোড</th>
                        <th>নোট</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="donationBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">কোনো দানের তথ্য নেই, নতুন যোগ করুন।</div>
        </div>
    </div>

    <script>
        const donationData = [
            { date: '2024-01-15', recipient: 'Charity Organization', amount: 2000, cause: 'Education', paymentMode: 'Online', note: 'School supplies' },
            { date: '2024-02-10', recipient: 'Mosque', amount: 1500, cause: 'Religious', paymentMode: 'Cash', note: 'Ramadan donation' },
            { date: '2024-03-05', recipient: 'Orphanage', amount: 1500, cause: 'Welfare', paymentMode: 'Card', note: 'Monthly support' }
        ];
        let editIndex = null;

        function renderTable() {
            const tbody = document.getElementById('donationBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (donationData.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            donationData.forEach((row, index) => {
                const tr = document.createElement('tr');

                if (editIndex === index) {
                    tr.innerHTML = `
                        <td><input type="date" value="${row.date}" id="date-${index}"></td>
                        <td><input type="text" value="${row.recipient}" id="recipient-${index}"></td>
                        <td><input type="number" min="0" value="${row.amount}" id="amount-${index}"></td>
                        <td>
                            <select id="cause-${index}">
                                <option value="Education" ${row.cause === 'Education' ? 'selected' : ''}>Education</option>
                                <option value="Religious" ${row.cause === 'Religious' ? 'selected' : ''}>Religious</option>
                                <option value="Welfare" ${row.cause === 'Welfare' ? 'selected' : ''}>Welfare</option>
                                <option value="Other" ${row.cause === 'Other' ? 'selected' : ''}>Other</option>
                            </select>
                        </td>
                        <td>
                            <select id="paymentMode-${index}">
                                <option value="Cash" ${row.paymentMode === 'Cash' ? 'selected' : ''}>Cash</option>
                                <option value="Card" ${row.paymentMode === 'Card' ? 'selected' : ''}>Card</option>
                                <option value="Online" ${row.paymentMode === 'Online' ? 'selected' : ''}>Online</option>
                            </select>
                        </td>
                        <td><input type="text" value="${row.note}" id="note-${index}"></td>
                        <td class="row-action">
                            <button class="btn-save" onclick="saveRow(${index})">Save</button>
                            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                        </td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td>${row.recipient}</td>
                        <td>৳ ${row.amount}</td>
                        <td><span class="tag tag-donation">${row.cause}</span></td>
                        <td>${row.paymentMode}</td>
                        <td>${row.note}</td>
                        <td class="row-action">
                            <button class="btn-edit" onclick="editRow(${index})">Edit</button>
                            <button class="btn-delete" onclick="deleteRow(${index})">Delete</button>
                        </td>
                    `;
                }

                tbody.appendChild(tr);
            });

            updateSummary();
        }

        function updateSummary() {
            const totalDonation = donationData.reduce((sum, row) => sum + row.amount, 0);
            const monthlyDonation = donationData.filter(row => row.date.startsWith('2024-03')).reduce((sum, row) => sum + row.amount, 0);
            const recipientsCount = new Set(donationData.map(row => row.recipient)).size;
            const avgDonation = donationData.length > 0 ? Math.round(totalDonation / donationData.length) : 0;

            document.getElementById('totalDonation').innerText = `৳ ${totalDonation}`;
            document.getElementById('monthlyDonation').innerText = `৳ ${monthlyDonation}`;
            document.getElementById('recipientsCount').innerText = recipientsCount;
            document.getElementById('avgDonation').innerText = `৳ ${avgDonation}`;
        }

        function editRow(index) {
            editIndex = index;
            renderTable();
        }

        function cancelEdit() {
            editIndex = null;
            renderTable();
        }

        function saveRow(index) {
            const date = document.getElementById(`date-${index}`).value;
            const recipient = document.getElementById(`recipient-${index}`).value.trim();
            const amount = Number(document.getElementById(`amount-${index}`).value);
            const cause = document.getElementById(`cause-${index}`).value;
            const paymentMode = document.getElementById(`paymentMode-${index}`).value;
            const note = document.getElementById(`note-${index}`).value.trim();

            if (!date || !recipient || amount <= 0) {
                alert('সব ফিল্ড পূরণ করুন এবং পরিমাণ ০-এর বেশি হতে হবে।');
                return;
            }

            donationData[index] = { date, recipient, amount, cause, paymentMode, note };
            editIndex = null;
            renderTable();
        }

        function deleteRow(index) {
            if (!confirm('এই দানের তথ্য মুছে ফেলতে চান?')) return;
            donationData.splice(index, 1);
            if (editIndex === index) editIndex = null;
            renderTable();
        }

        function addRow() {
            donationData.push({ date: new Date().toISOString().split('T')[0], recipient: 'New Recipient', amount: 0, cause: 'Other', paymentMode: 'Cash', note: '' });
            editIndex = donationData.length - 1;
            renderTable();
        }

        renderTable();
    </script>
</body>
</html>
