        .btn-edit { background: #f59e0b; color: white; }
        .btn-save { background: #10b981; color: white; }
        .btn-cancel { background: #9ca3af; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        input, select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 14px; }
        .empty-state { text-align: center; padding: 32px 0; color: #6b7280; }
    </style>

<body>
    <div class="page-header">
        <div>
            <a href="FACE APP.html">←</a>
            <div style="display:inline-block; vertical-align: middle; margin-left: 12px;">
                <h1 class="page-title">Income</h1>
                <p class="subtitle">আয়ের তথ্য এডিট এবং দেখুন</p>
            </div>
        </div>
        <button class="btn-add" onclick="addRow()">নতুন আয় যোগ করুন</button>
    </div>

    <div class="content">
        <div class="summary-card">
            <div class="summary-grid">
                <div class="stat-box">
                    <div class="stat-title">মোট আয়</div>
                    <div class="stat-value" id="totalIncome">৳ ৫০০০</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">এই মাসে</div>
                    <div class="stat-value" id="monthlyIncome">৳ ২০০০</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">সোর্স</div>
                    <div class="stat-value" id="sourcesCount">৩</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">গড় আয়</div>
                    <div class="stat-value" id="avgIncome">৳ ১৬৬৭</div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="action-bar">
                <span>আয়ের তথ্য</span>
                <button class="btn-refresh" onclick="renderTable()">রিফ্রেশ</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ</th>
                        <th>সোর্স</th>
                        <th>পরিমাণ</th>
                        <th>ক্যাটাগরি</th>
                        <th>নোট</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="incomeBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">কোনো আয়ের তথ্য নেই, নতুন যোগ করুন।</div>
        </div>
    </div>

    <script>
        const incomeData = [
            { date: '2024-01-15', source: 'Salary', amount: 2000, category: 'Job', note: 'Monthly salary' },
            { date: '2024-02-10', source: 'Freelance', amount: 1500, category: 'Business', note: 'Web design project' },
            { date: '2024-03-05', source: 'Investment', amount: 1500, category: 'Investment', note: 'Stock dividends' }
        ];
        let editIndex = null;

        function renderTable() {
            const tbody = document.getElementById('incomeBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (incomeData.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            incomeData.forEach((row, index) => {
                const tr = document.createElement('tr');

                if (editIndex === index) {
                    tr.innerHTML = `
                        <td><input type="date" value="${row.date}" id="date-${index}"></td>
                        <td><input type="text" value="${row.source}" id="source-${index}"></td>
                        <td><input type="number" min="0" value="${row.amount}" id="amount-${index}"></td>
                        <td>
                            <select id="category-${index}">
                                <option value="Job" ${row.category === 'Job' ? 'selected' : ''}>Job</option>
                                <option value="Business" ${row.category === 'Business' ? 'selected' : ''}>Business</option>
                                <option value="Investment" ${row.category === 'Investment' ? 'selected' : ''}>Investment</option>
                                <option value="Other" ${row.category === 'Other' ? 'selected' : ''}>Other</option>
                            </select>
                        </td>
                        <td><input type="text" value="${row.note}" id="note-${index}"></td>
                        <td class="row-action">
                            <button class="btn-save" onclick="saveRow(${index})">Save</button>
                            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                        </td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td>${row.source}</td>
                        <td>৳ ${row.amount}</td>
                        <td><span class="tag tag-income">${row.category}</span></td>
                        <td>${row.note}</td>
                        <td class="row-action">
                            <button class="btn-edit" onclick="editRow(${index})">Edit</button>
                            <button class="btn-delete" onclick="deleteRow(${index})">Delete</button>
                        </td>
                    `;
                }

                tbody.appendChild(tr);
            });

            updateSummary();
        }

        function updateSummary() {
            const totalIncome = incomeData.reduce((sum, row) => sum + row.amount, 0);
            const monthlyIncome = incomeData.filter(row => row.date.startsWith('2024-03')).reduce((sum, row) => sum + row.amount, 0);
            const sourcesCount = new Set(incomeData.map(row => row.source)).size;
            const avgIncome = incomeData.length > 0 ? Math.round(totalIncome / incomeData.length) : 0;

            document.getElementById('totalIncome').innerText = `৳ ${totalIncome}`;
            document.getElementById('monthlyIncome').innerText = `৳ ${monthlyIncome}`;
            document.getElementById('sourcesCount').innerText = sourcesCount;
            document.getElementById('avgIncome').innerText = `৳ ${avgIncome}`;
        }

        function editRow(index) {
            editIndex = index;
            renderTable();
        }

        function cancelEdit() {
            editIndex = null;
            renderTable();
        }

        function saveRow(index) {
            const date = document.getElementById(`date-${index}`).value;
            const source = document.getElementById(`source-${index}`).value.trim();
            const amount = Number(document.getElementById(`amount-${index}`).value);
            const category = document.getElementById(`category-${index}`).value;
            const note = document.getElementById(`note-${index}`).value.trim();

            if (!date || !source || amount <= 0) {
                alert('সব ফিল্ড পূরণ করুন এবং পরিমাণ ০-এর বেশি হতে হবে।');
                return;
            }

            incomeData[index] = { date, source, amount, category, note };
            editIndex = null;
            renderTable();
        }

        function deleteRow(index) {
            if (!confirm('এই আয়ের তথ্য মুছে ফেলতে চান?')) return;
            incomeData.splice(index, 1);
            if (editIndex === index) editIndex = null;
            renderTable();
        }

        function addRow() {
            incomeData.push({ date: new Date().toISOString().split('T')[0], source: 'New Source', amount: 0, category: 'Other', note: '' });
            editIndex = incomeData.length - 1;
            renderTable();
        }

        renderTable();
    </script>
