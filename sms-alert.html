<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBRYMS Finance - SMS Alert</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f3f4f6; color: #1f2937; }
        .page-header { background: #df146e; color: white; padding: 22px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
        .page-header a { color: white; text-decoration: none; font-size: 22px; }
        .page-title { margin: 0; font-size: 20px; font-weight: 700; }
        .subtitle { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .content { padding: 20px; }
        .summary-card { background: white; border-radius: 18px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 18px; }
        .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .stat-box { background: #f8fafc; border-radius: 15px; padding: 16px; }
        .stat-title { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
        .stat-value { font-size: 20px; font-weight: 700; color: #111827; }
        .action-bar { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 16px; }
        .action-bar button { border: none; border-radius: 14px; padding: 12px 16px; font-weight: 700; cursor: pointer; }
        .btn-add { background: #10b981; color: white; }
        .btn-refresh { background: #3b82f6; color: white; }
        .table-card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; }
        th { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .1em; border-bottom: 1px solid #e5e7eb; background: #f8fafc; position: sticky; top: 0; z-index: 1; }
        tbody tr:nth-child(even) { background: #fafafa; }
        tbody tr:hover { background: #f3f4f6; }
        td { border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
        .tag { display: inline-flex; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .tag-sent { background: #d1fae5; color: #065f46; }
        .tag-pending { background: #fef3c7; color: #d97706; }
        .row-action button { margin-right: 6px; padding: 7px 10px; border: none; border-radius: 12px; cursor: pointer; font-size: 12px; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-save { background: #10b981; color: white; }
        .btn-cancel { background: #9ca3af; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        input, select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 14px; }
        .empty-state { text-align: center; padding: 32px 0; color: #6b7280; }
    </style>

}

.menu-icon, .header-action { border-radius: 12px !important; }
.btn-main { border-radius: 999px !important; }
.container, .card, .app-header, .bottom-nav, .modal-content, .side-menu, .auth-box, .menu-icon, .header-action, .notification-bar, .icon-box, .profile-photo, .input-field, .btn-main { border: 1px solid rgba(255,255,255,0.06) !important; }

.container, .card, .app-header, .bottom-nav, .modal-content, .side-menu { background: rgba(7,17,36,0.56) !important; color: #e6eef6 !important; border-color: rgba(255,255,255,0.04) !important; box-shadow: 0 12px 30px rgba(2,6,23,0.6) !important; }

<style>
/* Remove page chrome borders; keep only .icon-box borders */
.container, .card, .app-header, .bottom-nav, .modal-content, .side-menu, .auth-box, .menu-icon, .header-action, .notification-bar, .profile-photo, .input-field, .btn-main {
  border: none !important;
  background-image: none !important;
  box-shadow: none !important;
}
.icon-box { border: 1px solid rgba(255,255,255,0.08) !important; background: transparent !important; box-shadow: none !important; }
body:not(.dark-mode) .icon-box { border-color: rgba(0,0,0,0.08) !important; }
</style>
<link rel="preload" as="image" href="assets/bg.png" fetchpriority="high">
<link rel="stylesheet" href="assets/bg.css">
</head>
<body>
    <div class="page-header">
        <div>
            <a href="FACE APP.html">←</a>
            <div style="display:inline-block; vertical-align: middle; margin-left: 12px;">
                <h1 class="page-title">SMS Alert</h1>
                <p class="subtitle">SMS অ্যালার্টের তথ্য এডিট এবং দেখুন</p>
            </div>
        </div>
        <button class="btn-add" onclick="addRow()">নতুন SMS যোগ করুন</button>
    </div>

    <div class="content">
        <div class="summary-card">
            <div class="summary-grid">
                <div class="stat-box">
                    <div class="stat-title">মোট SMS</div>
                    <div class="stat-value" id="totalSMS">৩</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">পাঠানো</div>
                    <div class="stat-value" id="sentSMS">২</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">পেন্ডিং</div>
                    <div class="stat-value" id="pendingSMS">১</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">এই মাসে</div>
                    <div class="stat-value" id="monthlySMS">২</div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="action-bar">
                <span>SMS অ্যালার্টের তথ্য</span>
                <button class="btn-refresh" onclick="renderTable()">রিফ্রেশ</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ</th>
                        <th>রিসিভার</th>
                        <th>মেসেজ</th>
                        <th>স্ট্যাটাস</th>
                        <th>টাইপ</th>
                        <th>নোট</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="smsBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">কোনো SMS এর তথ্য নেই, নতুন যোগ করুন।</div>
        </div>
    </div>

    <script>
        const smsData = [
            { date: '2024-01-15', receiver: '+8801234567890', message: 'Payment reminder', status: 'Sent', type: 'Reminder', note: 'Monthly fee' },
            { date: '2024-02-10', receiver: '+8801234567891', message: 'Welcome to SBRYMS', status: 'Sent', type: 'Welcome', note: 'New member' },
            { date: '2024-03-05', receiver: '+8801234567892', message: 'Due payment alert', status: 'Pending', type: 'Alert', note: 'Overdue' }
        ];
        let editIndex = null;

        function renderTable() {
            const tbody = document.getElementById('smsBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (smsData.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            smsData.forEach((row, index) => {
                const tr = document.createElement('tr');

                if (editIndex === index) {
                    tr.innerHTML = `
                        <td><input type="date" value="${row.date}" id="date-${index}"></td>
                        <td><input type="text" value="${row.receiver}" id="receiver-${index}"></td>
                        <td><input type="text" value="${row.message}" id="message-${index}"></td>
                        <td>
                            <select id="status-${index}">
                                <option value="Sent" ${row.status === 'Sent' ? 'selected' : ''}>Sent</option>
                                <option value="Pending" ${row.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Failed" ${row.status === 'Failed' ? 'selected' : ''}>Failed</option>
                            </select>
                        </td>
                        <td>
                            <select id="type-${index}">
                                <option value="Reminder" ${row.type === 'Reminder' ? 'selected' : ''}>Reminder</option>
                                <option value="Welcome" ${row.type === 'Welcome' ? 'selected' : ''}>Welcome</option>
                                <option value="Alert" ${row.type === 'Alert' ? 'selected' : ''}>Alert</option>
                                <option value="Other" ${row.type === 'Other' ? 'selected' : ''}>Other</option>
                            </select>
                        </td>
                        <td><input type="text" value="${row.note}" id="note-${index}"></td>
                        <td class="row-action">
                            <button class="btn-save" onclick="saveRow(${index})">Save</button>
                            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                        </td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td>${row.receiver}</td>
                        <td>${row.message}</td>
                        <td><span class="tag ${row.status === 'Sent' ? 'tag-sent' : 'tag-pending'}">${row.status}</span></td>
                        <td>${row.type}</td>
                        <td>${row.note}</td>
                        <td class="row-action">
                            <button class="btn-edit" onclick="editRow(${index})">Edit</button>
                            <button class="btn-delete" onclick="deleteRow(${index})">Delete</button>
                        </td>
                    `;
                }

                tbody.appendChild(tr);
            });

            updateSummary();
        }

        function updateSummary() {
            const totalSMS = smsData.length;
            const sentSMS = smsData.filter(row => row.status === 'Sent').length;
            const pendingSMS = smsData.filter(row => row.status === 'Pending').length;
            const monthlySMS = smsData.filter(row => row.date.startsWith('2024-03')).length;

            document.getElementById('totalSMS').innerText = totalSMS;
            document.getElementById('sentSMS').innerText = sentSMS;
            document.getElementById('pendingSMS').innerText = pendingSMS;
            document.getElementById('monthlySMS').innerText = monthlySMS;
        }

        function editRow(index) {
            editIndex = index;
            renderTable();
        }

        function cancelEdit() {
            editIndex = null;
            renderTable();
        }

        function saveRow(index) {
            const date = document.getElementById(`date-${index}`).value;
            const receiver = document.getElementById(`receiver-${index}`).value.trim();
            const message = document.getElementById(`message-${index}`).value.trim();
            const status = document.getElementById(`status-${index}`).value;
            const type = document.getElementById(`type-${index}`).value;
            const note = document.getElementById(`note-${index}`).value.trim();

            if (!date || !receiver || !message) {
                alert('তারিখ, রিসিভার এবং মেসেজ পূরণ করুন।');
                return;
            }

            smsData[index] = { date, receiver, message, status, type, note };
            editIndex = null;
            renderTable();
        }

        function deleteRow(index) {
            if (!confirm('এই SMS এর তথ্য মুছে ফেলতে চান?')) return;
            smsData.splice(index, 1);
            if (editIndex === index) editIndex = null;
            renderTable();
        }

        function addRow() {
            smsData.push({ date: new Date().toISOString().split('T')[0], receiver: '+880', message: 'New message', status: 'Pending', type: 'Other', note: '' });
            editIndex = smsData.length - 1;
            renderTable();
        }

        renderTable();
    </script>
<script src="assets/background-settings.js"></script>
</body>
</html>
