        .table-card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; }
        th { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .1em; border-bottom: 1px solid #e5e7eb; background: #f8fafc; position: sticky; top: 0; z-index: 1; }
        tbody tr:nth-child(even) { background: #fafafa; }

        .tag-silver { background: #e5e7eb; color: #374151; }
        .tag-bronze { background: #fed7aa; color: #9a3412; }
        .row-action button { margin-right: 6px; padding: 7px 10px; border: none; border-radius: 12px; cursor: pointer; font-size: 12px; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-save { background: #10b981; color: white; }
        .btn-cancel { background: #9ca3af; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        input, select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 14px; }
        .empty-state { text-align: center; padding: 32px 0; color: #6b7280; }
    </style>

<body>
    <div class="page-header">
        <div>
            <a href="FACE APP.html">←</a>
            <div style="display:inline-block; vertical-align: middle; margin-left: 12px;">
                <h1 class="page-title">Profile-Rank</h1>
                <p class="subtitle">প্রোফাইল র‍্যাংক এডিট এবং দেখুন</p>
            </div>
        </div>
        <button class="btn-add" onclick="addRow()">নতুন র‍্যাংক যোগ করুন</button>
    </div>

    <div class="content">
        <div class="summary-card">
            <div class="summary-grid">
                <div class="stat-box">
                    <div class="stat-title">মোট র‍্যাংক</div>
                    <div class="stat-value" id="totalRanks">৩</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">গোল্ড</div>
                    <div class="stat-value" id="goldRanks">১</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">সিলভার</div>
                    <div class="stat-value" id="silverRanks">১</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">ব্রোঞ্জ</div>
                    <div class="stat-value" id="bronzeRanks">১</div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="action-bar">
                <span>প্রোফাইল র‍্যাংকের তথ্য</span>
                <button class="btn-refresh" onclick="renderTable()">রিফ্রেশ</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>নাম</th>
                        <th>ডিপোজিট নাম</th>
                        <th>পয়েন্ট</th>
                        <th>র‍্যাংক</th>
                        <th>স্ট্যাটাস</th>
                        <th>অর্জন তারিখ</th>
                        <th>নোট</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="rankBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">কোনো র‍্যাংকের তথ্য নেই, নতুন যোগ করুন।</div>
        </div>
    </div>

    <script>
        let rankData = [
            { name: 'Mahdi Hasan', depositName: 'Main Deposit', points: 1500, rank: 'Gold', status: 'Active', achievementDate: '2024-01-15', note: 'Top contributor' },
            { name: 'Bushra', depositName: 'Secondary Deposit', points: 1200, rank: 'Silver', status: 'Active', achievementDate: '2024-02-10', note: 'Consistent performer' },
            { name: 'Rifat', depositName: 'Starter Deposit', points: 800, rank: 'Bronze', status: 'Active', achievementDate: '2024-03-05', note: 'New member' }
        ];
        // load saved data from localStorage if available
        const saved = localStorage.getItem('profileRanks');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) rankData = parsed.map(item => ({
                    // support older saved items that used 'contribution' or 'deposit' fields; map to depositName
                    name: item.name || '',
                    depositName: item.depositName || item.deposit || item.contribution || '',
                    points: item.points || 0,
                    rank: item.rank || 'Bronze',
                    status: item.status || 'Active',
                    achievementDate: item.achievementDate || '',
                    note: item.note || ''
                }));
            } catch (e) {
                console.warn('Failed to parse saved profileRanks', e);
            }
        }
        let editIndex = null;

        function renderTable() {
            const tbody = document.getElementById('rankBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (rankData.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            rankData.forEach((row, index) => {
                const tr = document.createElement('tr');

                if (editIndex === index) {
                    tr.innerHTML = `
                        <td><input type="text" value="${row.name}" id="name-${index}"></td>
                            <td><input type="text" value="${row.depositName || ''}" id="deposit-${index}"></td>
                            <td><input type="number" min="0" value="${row.points}" id="points-${index}"></td>
                            <td>
                                <select id="rank-${index}">
                                    <option value="Gold" ${row.rank === 'Gold' ? 'selected' : ''}>Gold</option>
                                    <option value="Silver" ${row.rank === 'Silver' ? 'selected' : ''}>Silver</option>
                                    <option value="Bronze" ${row.rank === 'Bronze' ? 'selected' : ''}>Bronze</option>
                                </select>
                            </td>
                        <td>
                            <select id="status-${index}">
                                <option value="Active" ${row.status === 'Active' ? 'selected' : ''}>Active</option>
                                <option value="Inactive" ${row.status === 'Inactive' ? 'selected' : ''}>Inactive</option>
                            </select>
                        </td>
                        <td><input type="date" value="${row.achievementDate}" id="achievementDate-${index}"></td>
                        <td><input type="text" value="${row.note}" id="note-${index}"></td>
                        <td class="row-action">
                            <button class="btn-save" onclick="saveRow(${index})">Save</button>
                            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                        </td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${row.name}</td>
                            <td>${row.depositName || ''}</td>
                            <td>${row.points}</td>
                            <td><span class="tag tag-${row.rank.toLowerCase()}">${row.rank}</span></td>
                            <td>${row.status}</td>
                            <td>${row.achievementDate}</td>
                            <td>${row.note}</td>
                            <td class="row-action">
                                <button class="btn-edit" onclick="editRow(${index})">Edit</button>
                                <button class="btn-delete" onclick="deleteRow(${index})">Delete</button>
                            </td>
                    `;
                }

                tbody.appendChild(tr);
            });

            updateSummary();
        }

        function updateSummary() {
            const totalRanks = rankData.length;
            const goldRanks = rankData.filter(row => row.rank === 'Gold').length;
            const silverRanks = rankData.filter(row => row.rank === 'Silver').length;
            const bronzeRanks = rankData.filter(row => row.rank === 'Bronze').length;

            document.getElementById('totalRanks').innerText = totalRanks;
            document.getElementById('goldRanks').innerText = goldRanks;
            document.getElementById('silverRanks').innerText = silverRanks;
            document.getElementById('bronzeRanks').innerText = bronzeRanks;
        }

        function editRow(index) {
            editIndex = index;
            renderTable();
        }

        function cancelEdit() {
            editIndex = null;
            renderTable();
        }

        function saveRow(index) {
            const name = document.getElementById(`name-${index}`).value.trim();
            const depositName = document.getElementById(`deposit-${index}`).value.trim();
            const points = Number(document.getElementById(`points-${index}`).value);
            const rank = document.getElementById(`rank-${index}`).value;
            const status = document.getElementById(`status-${index}`).value;
            const achievementDate = document.getElementById(`achievementDate-${index}`).value;
            const note = document.getElementById(`note-${index}`).value.trim();

            if (!name || points < 0) {
                alert('নাম এবং পয়েন্ট সঠিকভাবে পূরণ করুন।');
                return;
            }

            rankData[index] = { name, depositName, points, rank, status, achievementDate, note };
            editIndex = null;
            saveToStorage();
            renderTable();
        }

        function deleteRow(index) {
            if (!confirm('এই র‍্যাংকের তথ্য মুছে ফেলতে চান?')) return;
            rankData.splice(index, 1);
            if (editIndex === index) editIndex = null;
            saveToStorage();
            renderTable();
        }

        function addRow() {
            rankData.push({ name: 'New Member', depositName: '', points: 0, rank: 'Bronze', status: 'Active', achievementDate: new Date().toISOString().split('T')[0], note: '' });
            editIndex = rankData.length - 1;
            saveToStorage();
            renderTable();
        }

        function saveToStorage() {
            try {
                localStorage.setItem('profileRanks', JSON.stringify(rankData));
            } catch (e) {
                console.warn('Failed to save profileRanks', e);
            }
        }

        renderTable();
    </script>
<script src="assets/background-settings.js"></script>
</body>
