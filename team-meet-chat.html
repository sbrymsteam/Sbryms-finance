            ? `<a class="attachment-message" href="${msg.fileUrl}" target="_blank" rel="noopener"><img src="${msg.fileUrl}" alt="${safeName}"></a>`
            : msg.fileType && msg.fileType.startsWith('video/')
              ? `<div class="attachment-message"><video src="${msg.fileUrl}" controls preload="metadata"></video></div>`
              : `<a class="attachment-message attachment-file" href="${msg.fileUrl}" target="_blank" rel="noopener">📎 ${safeName}</a>`;
          return `
            <div class="msg-row ${isMe ? 'me' : 'them'}" data-message-index="${index}">
              <div class="message-stack">
                <div class="message-card">
                  ${renderGroupSenderProfile(msg, isMe)}
                  <div class="bubble">
                    ${attachmentMarkup}
                    ${msg.text ? `<div>${msg.text}</div>` : ''}
                    <span class="time">${msg.time}${isMe ? `<span class="message-status">${msg.status === 'seen' ? 'Seen' : msg.status === 'delivered' ? 'Delivered' : 'Sent'}</span>` : ''}</span>
                  </div>
                  ${renderSeenBy(msg, isMe)}
                 ${renderMessageReactions(msg, index) ? `<div class="message-reactions">${renderMessageReactions(msg, index)}</div>` : ''}
                </div>
              </div>
            </div>
          `;
        }

        if (msg.type === 'call-history') {
          const callLabel = msg.callType === 'video' ? 'ভিডিও কল' : 'ভয়েস কল';
          const callDuration = msg.duration || '00:00';
          const hasCallDuration = Number(msg.durationSeconds) > 0 || callDuration !== '00:00';
          return `
            <div class="msg-row ${isMe ? 'me' : 'them'}" data-message-index="${index}">
              <div class="message-stack">
                <div class="message-card">
                  ${renderGroupSenderProfile(msg, isMe)}
                  <div class="bubble">
                    <div class="call-history">
                      <div class="call-history-icon">${msg.callType === 'video' ? '▣' : '☎'}</div>
                      <div><strong>${callLabel}</strong><span>${hasCallDuration ? `কলের সময়কাল: ${callDuration}` : 'কল বাতিল হয়েছে'}</span></div>
                    </div>
                    <span class="time">${msg.time}${isMe ? `<span class="message-status">${msg.status === 'seen' ? 'Seen' : 'Sent'}</span>` : ''}</span>
                  </div>
                  ${renderSeenBy(msg, isMe)}
                 ${renderMessageReactions(msg, index) ? `<div class="message-reactions">${renderMessageReactions(msg, index)}</div>` : ''}
                </div>
              </div>
            </div>
          `;
        }

        if (msg.type === 'call-invite') {
          return `
            <div class="msg-row ${isMe ? 'me' : 'them'}" data-message-index="${index}">
              <div class="message-stack">
                <div class="message-card">
                  ${renderGroupSenderProfile(msg, isMe)}
                  <div class="bubble">
                    <div>${msg.text}</div>
                    <span class="time">${msg.time}</span>
                  </div>
                  ${renderSeenBy(msg, isMe)}
                </div>
              </div>
            </div>
          `;
        }

        const statusMarkup = isMe ? `<span class="message-status">${msg.status === 'seen' ? 'Seen' : msg.status === 'delivered' ? 'Delivered' : 'Sent'}</span>` : '';
        const messageContent = msg.deleted
          ? '<div class="deleted-message">Message deleted</div>'
          : `<div>${msg.text || 'Voice message'}</div>`;
        const bubbleBlock = `
          <div class="bubble">
            ${replyMarkup}
            ${messageContent}
            <span class="time">${msg.time}${statusMarkup}</span>
          </div>
        `;

        return `
          <div class="msg-row ${isMe ? 'me' : 'them'}" data-message-index="${index}">
            <div class="message-stack">
              <div class="message-card">
                ${renderGroupSenderProfile(msg, isMe)}
                ${bubbleBlock}
                ${renderSeenBy(msg, isMe)}
                ${renderMessageReactions(msg, index) ? `<div class="message-reactions">${renderMessageReactions(msg, index)}</div>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
      messagesEl.scrollTop = messagesEl.scrollHeight;

      document.querySelectorAll('.voice-play').forEach((btn) => {
        btn.addEventListener('click', () => playVoiceMessage(btn));
      });

      document.querySelectorAll('.msg-row').forEach((row) => {
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let trackingSwipe = false;
        let longPressTimer = null;
        let longPressTriggered = false;
        row.addEventListener('touchstart', (event) => {
          const touch = event.changedTouches[0];
          if (!touch) return;
          startX = touch.clientX;
          startY = touch.clientY;
          currentX = startX;
          trackingSwipe = true;
          longPressTriggered = false;
          clearTimeout(longPressTimer);
          longPressTimer = setTimeout(() => {
            if (!trackingSwipe) return;
            longPressTriggered = true;
            trackingSwipe = false;
            openMessageContextMenu(Number(row.dataset.messageIndex), touch.clientX, touch.clientY, row);
          }, 1000);
        }, { passive: true });
        row.addEventListener('touchmove', (event) => {
          if (!trackingSwipe) return;
          const touch = event.changedTouches[0];
          if (!touch) return;
          currentX = touch.clientX;
          const deltaX = currentX - startX;
          const deltaY = Math.abs(touch.clientY - startY);
          if (Math.abs(currentX - startX) > 10 || deltaY > 10) {
            clearTimeout(longPressTimer);
          }
          if (deltaX > 0 && deltaX > deltaY) {
            row.style.transform = `translateX(${Math.min(deltaX, 72)}px)`;
          }
        }, { passive: true });
        row.addEventListener('touchend', () => {
          clearTimeout(longPressTimer);
          if (longPressTriggered) {
            row.style.transform = '';
            return;
          }
          if (!trackingSwipe) return;
          const distance = currentX - startX;
          trackingSwipe = false;
          row.style.transform = '';
          if (distance >= 55) {
            replyToMessageAtIndex(Number(row.dataset.messageIndex));
          }
        }, { passive: true });
        row.addEventListener('touchcancel', () => {
          clearTimeout(longPressTimer);
          trackingSwipe = false;
          row.style.transform = '';
        }, { passive: true });
        row.addEventListener('contextmenu', (event) => {
          event.preventDefault();
          openMessageContextMenu(Number(row.dataset.messageIndex), event.clientX, event.clientY, row);
        });
      });

      document.querySelectorAll('.reaction-pill').forEach((button) => {
        button.addEventListener('click', () => {
          const index = Number(button.dataset.index);
          const emoji = button.dataset.emoji;
          if (Number.isFinite(index) && emoji) toggleMessageReaction(index, emoji);
        });
      });

    }

    function joinGroupCall(encodedRoomId, type) {
      const roomId = decodeURIComponent(encodedRoomId || '');
      if (!roomId) return;
      window.location.href = `team-meet-call.html?chat=team-group&group=true&room=${encodeURIComponent(roomId)}&type=${encodeURIComponent(type || 'audio')}`;
    }

    function listenForIncomingCalls() {
      if (!currentUserEmail) return;
      const showIncomingCall = (call, isGroupCall) => {
          if (call.data().callerId === currentUserEmail) return;
          const banner = document.getElementById('incomingCall');
          if (!banner) return;
          if (!call) {
            banner.style.display = 'none';
            stopIncomingCallTone();
            activeIncomingCallId = null;
            return;
          }
          const data = call.data();
          const createdAt = data.createdAt && typeof data.createdAt.toMillis === 'function'
            ? data.createdAt.toMillis()
            : (data.createdAt ? new Date(data.createdAt).getTime() : Date.now());
          if (Date.now() - createdAt >= 60000) {
            stopIncomingCallTone();
            call.ref.update({ status: 'ended', endedReason: 'timeout' }).catch(error => {
              console.error('Failed to expire incoming call:', error);
            });
            banner.style.display = 'none';
            return;
          }
          banner.style.display = 'flex';
          startIncomingCallTone();
          if (activeIncomingCallId !== call.id) {
            activeIncomingCallId = call.id;
            requestBrowserNotifications().then(permission => {
              if (permission === 'granted' && activeIncomingCallId === call.id) {
              const notification = new Notification(data.callerName || 'Incoming call', {
                body: `${data.callType === 'video' ? 'Video' : 'Audio'} call`,
                icon: buildAvatarSvg(data.callerName || 'Caller'),
                tag: `incoming-call-${call.id}`
              });
              notification.onclick = () => {
                window.focus();
                notification.close();
              };
              }
            });
          }
          if (incomingCallExpiryTimer) clearTimeout(incomingCallExpiryTimer);
          const remainingMs = Math.max(0, 60000 - (Date.now() - createdAt));
          incomingCallExpiryTimer = setTimeout(() => {
            call.ref.update({ status: 'ended', endedReason: 'timeout' }).catch(error => {
              console.error('Failed to expire incoming call:', error);
            });
            banner.style.display = 'none';
            stopIncomingCallTone();
          }, remainingMs);
          document.getElementById('incomingCallText').textContent = isGroupCall
            ? `${data.callerName || 'A member'} started a Team Group ${data.callType === 'video' ? 'video' : 'audio'} call`
            : `${data.callerName || data.callerId || 'Someone'} is calling`;
          document.getElementById('acceptIncomingCall').onclick = () => {
            stopIncomingCallTone();
            const groupParams = isGroupCall
              ? `chat=team-group&group=true&room=${encodeURIComponent(data.roomId || '')}&role=callee`
              : `chat=${encodeURIComponent(data.callerId || '')}&call=${encodeURIComponent(call.id)}&role=callee`;
            window.location.href = `team-meet-call.html?${groupParams}&type=${encodeURIComponent(data.callType || 'audio')}`;
          };
          document.getElementById('rejectIncomingCall').onclick = () => {
            stopIncomingCallTone();
            banner.style.display = 'none';
            activeIncomingCallId = null;
            if (incomingCallExpiryTimer) {
              clearTimeout(incomingCallExpiryTimer);
              incomingCallExpiryTimer = null;
            }
            if (!isGroupCall) {
              call.ref.update({ status: 'ended', endedReason: 'rejected' }).catch(error => {
                console.error('Failed to reject incoming call:', error);
              });
            }
          };
      };
      if (!isGroupChat) {
        db.collection('calls')
          .where('receiverId', '==', currentUserEmail)
          .onSnapshot(snapshot => {
            const call = snapshot.docs.find(doc => doc.data().status === 'ringing');
            if (call) showIncomingCall(call, false);
          }, error => console.error('Incoming call listener failed:', error));
      }
      db.collection('calls')
        .where('groupId', '==', 'team-group')
        .onSnapshot(snapshot => {
          const call = snapshot.docs.find(doc => doc.data().status === 'ringing');
          if (call) showIncomingCall(call, true);
        }, error => console.error('Team group call listener failed:', error));
    }

    let lastRenderedMessageIds = new Set();
    const pendingMessageIds = new Set();
    function listenForMessages() {
      conversationRef.onSnapshot((doc) => {
        if (!doc.exists) {
          const fallbackMessages = getMessages();
          renderMessages(fallbackMessages);
          return;
        }

        let firestoreMessages = doc.data().messages || [];
        const localMessages = getMessages();
        const firestoreMessageIds = new Set(firestoreMessages.map(message => message.id));
        const localOnlyMessages = localMessages.filter(message => !firestoreMessageIds.has(message.id));
        firestoreMessages = [...firestoreMessages, ...localOnlyMessages];
        firestoreMessageIds.forEach(id => pendingMessageIds.delete(id));
        const newIncoming = firestoreMessages.filter(message =>
          !isMessageFromCurrentUser(message) &&
          !lastRenderedMessageIds.has(message.id) &&
          message.status !== 'seen'
        );
        firestoreMessages = markIncomingMessagesRead(firestoreMessages);
        firestoreMessages = markGroupMessagesSeen(firestoreMessages);
        firestoreMessages = markPrivateMessagesSeen(firestoreMessages);
        newIncoming.forEach(showMessageNotification);
        lastRenderedMessageIds = new Set(firestoreMessages.map(message => message.id));
        localStorage.setItem(storageKey, JSON.stringify(firestoreMessages));
        renderMessages(firestoreMessages);
      }, (error) => {
        console.error('Snapshot error:', error);
        renderMessages(getMessages());
      });
    }

    function toggleMessageReaction(index, emoji) {
      const messages = getMessages();
      const target = messages[index];
      if (!target) return;
      if (!target.reactions) target.reactions = {};
      target.reactions[emoji] = (target.reactions[emoji] || 0) + 1;
      saveMessages(messages);
      renderMessages(messages);
    }

    function renderMessageReactions(message, index) {
      return Object.entries(message.reactions || {}).map(([emoji, count]) => `
        <button type="button" class="reaction-pill" data-index="${index}" data-emoji="${emoji}" aria-label="React with ${emoji}">${emoji}${count > 1 ? ` ${count}` : ''}</button>
      `).join('');
    }

    function updateTypingIndicator(isTyping) {
      const indicator = document.getElementById('typingIndicator');
      if (!indicator) return;
      indicator.hidden = !isTyping;
      indicator.classList.toggle('visible', isTyping);
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const messages = getMessages();
      if (editingMessageIndex !== null) {
        const target = messages[editingMessageIndex];
        if (target && !target.deleted) {
          target.text = text;
          target.editedAt = new Date().toISOString();
          saveMessages(messages);
          editingMessageIndex = null;
          input.value = '';
          input.placeholder = 'Type a message...';
          renderMessages(messages);
        }
        return;
      }
      const message = {
        id: `msg-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        sender: 'me',
        senderEmail: currentUserEmail,
        senderName: getCurrentSenderProfile().name,
        senderPhoto: getCurrentSenderProfile().photo,
        self: true,
        status: 'sent',
        text,
        createdAt: new Date().toISOString(),
        time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
        reactions: {},
        replyTo: activeReply ? {
          text: activeReply.text,
          senderName: activeReply.senderName
        } : null
      };
      requestBrowserNotifications();
      playSendTone();
      updateTypingIndicator(false);
      const nextMessages = [...messages, message];
      pendingMessageIds.add(message.id);
      saveNewMessage(message);
      createInAppNotification({
        to: isGroupChat ? 'all' : selectedMember.email,
        type: 'message',
        title: `New message from ${localStorage.getItem('currentUserName') || 'SBRYMS member'}`,
        message: text
      });
      input.value = '';
      activeReply = null;
      renderReplyPreview();
      input.placeholder = 'Type a message...';
      renderMessages(nextMessages);
    }

    async function openCall(type) {
      localStorage.setItem('selectedProfileName', selectedMember.name || 'Member');
      localStorage.setItem('selectedProfileEmail', selectedMember.email || '');
      localStorage.setItem('selectedProfilePhoto', selectedMember.photo || '');
      if (isGroupChat) {
        const roomId = `group-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const groupCallId = `group-call-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const messages = getMessages();
        const inviteMessage = {
          id: `call-${Date.now()}`,
          sender: 'me',
          senderEmail: currentUserEmail,
          senderName: getCurrentSenderProfile().name,
          senderPhoto: getCurrentSenderProfile().photo,
          self: true,
          type: 'call-invite',
          callType: type,
          roomId,
          text: `${type === 'video' ? 'Video' : 'Audio'} group call started`,
          time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
          reactions: {}
        };
        saveMessages([...messages, inviteMessage]);
        createInAppNotification({
          to: 'all',
          type: 'team_call',
          title: 'Team group call',
          message: `${type === 'video' ? 'Video' : 'Audio'} group call started`
        });
        await db.collection('calls').doc(groupCallId).set({
          groupId: 'team-group',
          roomId,
          callerId: currentUserEmail,
          callerName: localStorage.getItem('currentUserName') || 'SBRYMS member',
          callType: type,
          status: 'ringing',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(error => {
          console.error('Failed to publish group call:', error);
          throw error;
        });
        const url = `team-meet-call.html?chat=team-group&group=true&room=${encodeURIComponent(roomId)}&role=caller&type=${type}`;
        window.location.href = url;
        return;
      }
      const callId = `call-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const url = `team-meet-call.html?chat=${encodeURIComponent(selectedMember.email)}&call=${encodeURIComponent(callId)}&role=caller&type=${type}`;
      window.location.href = url;
    }

    let activeReply = null;
    let editingMessageIndex = null;
    let voiceRecordingStart = 0;
    let voiceRecordingEnd = 0;
    let lastVoiceDurationSeconds = 0;
    let voiceTimerInterval = null;
    let mediaRecorder = null;
    let voiceRecordedChunks = [];
    let voiceRecordedDataUrl = '';
    let activeVoiceAudio = null;
    let voiceReadyToSend = false;
    let isVoiceRecording = false;

    function formatVoiceTime(totalSeconds) {
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function updateVoiceSendState() {
      const sendBtn = document.querySelector('.voice-send-btn');
      const replayBtn = document.querySelector('.voice-replay-btn');
      const deleteBtn = document.querySelector('.voice-delete-btn');
      if (!sendBtn) return;
      const hasAudio = !!voiceRecordedDataUrl;
      sendBtn.disabled = !hasAudio;
      if (replayBtn) replayBtn.style.display = hasAudio ? 'inline-flex' : 'none';
      if (deleteBtn) deleteBtn.style.display = hasAudio ? 'inline-flex' : 'none';
    }

    function replayVoiceRecording() {
      if (!voiceRecordedDataUrl) return;
      if (activeVoiceAudio) {
        activeVoiceAudio.pause();
      }
      const audio = new Audio(voiceRecordedDataUrl);
      activeVoiceAudio = audio;
      audio.onended = () => {
        activeVoiceAudio = null;
      };
      audio.play().catch(() => {
        activeVoiceAudio = null;
      });
    }

    function deleteVoiceRecording() {
      if (activeVoiceAudio) {
        activeVoiceAudio.pause();
        activeVoiceAudio = null;
      }
      voiceRecordedChunks = [];
      voiceRecordedDataUrl = '';
      voiceReadyToSend = false;
      stopVoiceTimer();
      updateVoiceSendState();
    }

    function updateVoiceTimer() {
      const timerEl = document.querySelector('.voice-timer');
      if (!timerEl || !isVoiceRecording || !voiceRecordingStart) return;
      const elapsedSeconds = Math.max(1, Math.floor((Date.now() - voiceRecordingStart) / 1000));
      timerEl.textContent = formatVoiceTime(elapsedSeconds);
    }

    function stopVoiceTimer(finalSeconds = 0) {
      if (voiceTimerInterval) {
        clearInterval(voiceTimerInterval);
        voiceTimerInterval = null;
      }
      isVoiceRecording = false;
      const timerEl = document.querySelector('.voice-timer');
      if (timerEl) {
        const displaySeconds = finalSeconds > 0 ? finalSeconds : 0;
        timerEl.textContent = formatVoiceTime(displaySeconds);
      }
      const recordBtn = document.querySelector('.voice-record-btn');
      if (recordBtn) {
        recordBtn.classList.remove('is-recording');
        recordBtn.setAttribute('aria-label', 'Record voice message');
      }
      lastVoiceDurationSeconds = finalSeconds > 0 ? finalSeconds : 0;
      voiceRecordingStart = 0;
      voiceRecordingEnd = 0;
    }

    function startVoiceTimer() {
      isVoiceRecording = true;
      voiceRecordingStart = Date.now();
      voiceRecordingEnd = 0;
      lastVoiceDurationSeconds = 0;
      voiceReadyToSend = false;
      updateVoiceSendState();
      updateVoiceTimer();
      if (voiceTimerInterval) clearInterval(voiceTimerInterval);
      voiceTimerInterval = setInterval(updateVoiceTimer, 1000);
      const recordBtn = document.querySelector('.voice-record-btn');
      if (recordBtn) {
        recordBtn.classList.add('is-recording');
        recordBtn.setAttribute('aria-label', 'Stop recording');
      }
    }

    function setComposerMode(mode) {
      const composer = document.querySelector('.composer');
      const voiceButton = document.querySelector('.mode-btn[data-mode="voice"]');
      composer.dataset.mode = mode;
      if (voiceButton) {
        voiceButton.classList.toggle('active', mode === 'voice');
      }

      if (mode === 'voice') {
        if (!mediaRecorder || mediaRecorder.state !== 'recording') {
          startVoiceRecording();
        }
        return;
      }

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopVoiceRecording();
      }
      stopVoiceTimer();
      voiceRecordedDataUrl = '';
      voiceRecordedChunks = [];
      voiceReadyToSend = false;
      updateVoiceSendState();
    }

    function makeVoiceBars(durationLabel) {
      const bars = [18, 28, 36, 72, 42, 62, 18, 82, 34, 58, 26, 64, 44, 74, 24, 52, 38, 68, 22, 48];
      return bars.map((height, index) => {
        const displayHeight = Math.max(18, Math.min(100, height + (index % 3 === 0 ? 12 : 0)));
        return `<span style="--i:${index + 1}; --h:${displayHeight}%"></span>`;
      }).join('');
    }

    let activeVoicePlaybackTimer = null;

    function updateVoicePlaybackTimer(audio, button) {
      const durationEl = button.closest('.bubble.voice-bubble')?.querySelector('.voice-duration');
      if (!durationEl || !audio) return;
      const elapsed = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
      const display = formatVoiceTime(Math.max(0, Math.floor(elapsed)));
      durationEl.textContent = display;
    }

    function stopVoicePlaybackTimer() {
      if (activeVoicePlaybackTimer) {
        clearInterval(activeVoicePlaybackTimer);
        activeVoicePlaybackTimer = null;
      }
    }

    function resetVoicePlaybackState() {
      if (activeVoiceAudio) {
        activeVoiceAudio.pause();
        activeVoiceAudio.currentTime = 0;
        activeVoiceAudio = null;
      }
      stopVoicePlaybackTimer();

      const activeButton = document.querySelector('.voice-play.is-playing');
      if (activeButton) {
        activeButton.classList.remove('is-playing');
        activeButton.textContent = '▶';
        activeButton.setAttribute('aria-label', 'Play voice message');
        const bubble = activeButton.closest('.bubble.voice-bubble');
        const durationEl = bubble?.querySelector('.voice-duration');
        if (durationEl) {
          durationEl.textContent = activeButton.dataset.durationLabel || activeButton.dataset.duration || '00:05';
        }
      }

      const activeBubble = document.querySelector('.bubble.voice-bubble.is-playing');
      if (activeBubble) {
        activeBubble.classList.remove('is-playing');
      }
    }

    function playVoiceMessage(button) {
      const rawAudioUrl = button.dataset.audioUrl || '';
      const audioUrl = rawAudioUrl ? decodeURIComponent(rawAudioUrl) : '';
      const bubble = button.closest('.bubble.voice-bubble');
      if (!audioUrl) {
        return;
      }

      if (button.classList.contains('is-playing')) {
        resetVoicePlaybackState();
        return;
      }

      resetVoicePlaybackState();
      button.classList.add('is-playing');
      bubble.classList.add('is-playing');
      button.textContent = '❚❚';
      button.setAttribute('aria-label', 'Pause voice message');

      const audio = new Audio(audioUrl);
      activeVoiceAudio = audio;

      const durationLabel = button.dataset.durationLabel || button.dataset.duration || '00:05';
      const durationEl = bubble?.querySelector('.voice-duration');
      if (durationEl) {
        durationEl.textContent = '00:00';
      }

      const tick = () => updateVoicePlaybackTimer(audio, button);
      tick();
      activeVoicePlaybackTimer = setInterval(tick, 250);

      audio.addEventListener('timeupdate', tick);
      audio.onended = () => {
        stopVoicePlaybackTimer();
        resetVoicePlaybackState();
      };
      audio.play().catch(() => {
        stopVoicePlaybackTimer();
        resetVoicePlaybackState();
      });
    }

    function readAudioBlob(blob) {
      return new Promise((resolve) => {
        if (!blob || blob.size === 0) {
          resolve('');
          return;
        }

        const reader = new FileReader();
        reader.onloadend = () => {
          resolve(typeof reader.result === 'string' ? reader.result : '');
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(blob);
      });
    }

    async function finalizeVoiceRecord(blob) {
      const url = await readAudioBlob(blob);
      voiceRecordedDataUrl = url;
      voiceReadyToSend = !!voiceRecordedDataUrl;
      updateVoiceSendState();
    }

    async function sendVoiceMessage() {
      if (!voiceRecordedDataUrl) {
        const blob = new Blob(voiceRecordedChunks, { type: 'audio/webm' });
        voiceRecordedDataUrl = await readAudioBlob(blob);
      }

      if (!voiceRecordedDataUrl) {
        return;
      }

      const messages = getMessages();
      const rawSeconds = lastVoiceDurationSeconds || (voiceRecordingStart ? Math.max(1, Math.floor((Date.now() - voiceRecordingStart) / 1000)) : 5);
      const duration = formatVoiceTime(rawSeconds);
      const voiceMessage = {
        id: `voice-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        sender: 'me',
        senderEmail: currentUserEmail,
        senderName: getCurrentSenderProfile().name,
        senderPhoto: getCurrentSenderProfile().photo,
        self: true,
        status: 'sent',
        type: 'voice',
        duration,
        durationSeconds: rawSeconds,
        text: 'Voice message',
        audioDataUrl: voiceRecordedDataUrl,
        time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      };
      const nextMessages = [...messages, voiceMessage];
      saveMessages(nextMessages);
      renderMessages(nextMessages);
      stopVoiceTimer(rawSeconds);
      voiceRecordedChunks = [];
      voiceRecordedDataUrl = '';
      voiceReadyToSend = false;
      updateVoiceSendState();
      setComposerMode('text');
    }

    function startVoiceRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('This browser does not support microphone recording.');
        return;
      }

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then((stream) => {
          voiceRecordedChunks = [];
          voiceRecordedDataUrl = '';
          voiceReadyToSend = false;
          updateVoiceSendState();
          const mimeType = (typeof MediaRecorder !== 'undefined' && typeof MediaRecorder.isTypeSupported === 'function' && MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))
            ? 'audio/webm;codecs=opus'
            : 'audio/webm';

          mediaRecorder = new MediaRecorder(stream, { mimeType });
          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              voiceRecordedChunks.push(event.data);
            }
          };
          mediaRecorder.onstop = () => {
            const recordedBlob = new Blob(voiceRecordedChunks, { type: mimeType });
            finalizeVoiceRecord(recordedBlob);
            voiceRecordingEnd = Date.now();
            const timerSeconds = voiceRecordingStart ? Math.max(1, Math.floor((voiceRecordingEnd - voiceRecordingStart) / 1000)) : 0;
            if (timerSeconds > 0) {
              lastVoiceDurationSeconds = timerSeconds;
            }
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          startVoiceTimer();
        })
        .catch((error) => {
          console.error('Microphone access denied:', error);
          alert('Microphone access is required to record a voice message.');
          stopVoiceTimer();
        });
    }

    function stopVoiceRecording() {
      const wasRecording = !!(mediaRecorder && mediaRecorder.state === 'recording');
      let finalSeconds = 0;
      if (wasRecording) {
        finalSeconds = voiceRecordingStart ? Math.max(1, Math.floor((Date.now() - voiceRecordingStart) / 1000)) : 1;
        lastVoiceDurationSeconds = finalSeconds;
        mediaRecorder.stop();
      }
      if (mediaRecorder) {
        mediaRecorder = null;
      }
      if (wasRecording) {
        stopVoiceTimer(finalSeconds);
      }
    }

    updateVoiceSendState();

    const attachmentToggle = document.getElementById('attachmentToggle');
    const attachmentSheet = document.getElementById('attachmentSheet');
    const attachmentClose = document.getElementById('attachmentClose');
    const attachmentFileInput = document.getElementById('attachmentFileInput');
    const attachmentNotice = document.getElementById('attachmentNotice');
    let attachmentNoticeTimer = null;

    function setAttachmentSheet(open) {
      attachmentSheet.classList.toggle('is-open', open);
      attachmentToggle.setAttribute('aria-expanded', String(open));
    }

    function showAttachmentNotice(message) {
      clearTimeout(attachmentNoticeTimer);
      attachmentNotice.textContent = message;
      attachmentNotice.classList.add('is-visible');
      attachmentNoticeTimer = setTimeout(() => attachmentNotice.classList.remove('is-visible'), 2800);
    }

    attachmentToggle.addEventListener('click', () => {
      playTabTone();
      setAttachmentSheet(!attachmentSheet.classList.contains('is-open'));
    });
    attachmentClose.addEventListener('click', () => setAttachmentSheet(false));
    async function sendAttachment(file) {
      if (!file) return;
      if (file.size > MAX_ATTACHMENT_BYTES) {
        showAttachmentNotice('ফাইলের সর্বোচ্চ সীমা ২০ MB');
        return;
      }
      const uploadUser = firebase.auth().currentUser;
      if (!uploadUser) {
        showAttachmentNotice('ফাইল পাঠাতে আগে লগইন করুন');
        return;
      }
      showAttachmentNotice('ফাইল আপলোড হচ্ছে...');
      try {
        const safeFileName = file.name.replace(/[^\w.\-]+/g, '_');
        const uploadServerOrigin = window.location.port === '5000' ? '' : 'http://localhost:5000';
        const signatureResponse = await fetch(`${uploadServerOrigin}/api/cloudinary-signature`);
        if (!signatureResponse.ok) throw new Error('Could not create Cloudinary upload signature.');
        const signature = await signatureResponse.json();
        const formData = new FormData();
        formData.append('file', file);
        formData.append('api_key', signature.apiKey);
        formData.append('timestamp', String(signature.timestamp));
        formData.append('folder', signature.folder);
        formData.append('signature', signature.signature);
        const resourceType = file.type.startsWith('video/') ? 'video' : 'image';
        const uploadResponse = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(signature.cloudName)}/${resourceType}/upload`, {
          method: 'POST',
          body: formData
        });
        if (!uploadResponse.ok) {
          let cloudinaryError = '';
          try {
            const errorBody = await uploadResponse.json();
            cloudinaryError = errorBody.error && errorBody.error.message ? ` ${errorBody.error.message}` : '';
          } catch (parseError) {
            console.error('Could not read Cloudinary upload error:', parseError);
          }
          throw new Error(`Cloudinary upload failed (${uploadResponse.status}).${cloudinaryError}`);
        }
        const uploaded = await uploadResponse.json();
        const fileUrl = uploaded.secure_url;
        const message = {
          id: `attachment-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          sender: 'me',
          senderEmail: currentUserEmail,
          senderName: getCurrentSenderProfile().name,
          senderPhoto: getCurrentSenderProfile().photo,
          self: true,
          status: 'sent',
          type: 'attachment',
          fileUrl,
          fileName: safeFileName,
          fileType: file.type,
          fileSize: file.size,
          time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
          reactions: {}
        };
        const nextMessages = [...getMessages(), message];
        saveMessages(nextMessages);
        renderMessages(nextMessages);
        showAttachmentNotice('ফাইল সফলভাবে পাঠানো হয়েছে');
      } catch (error) {
        console.error('Failed to upload attachment:', error);
        showAttachmentNotice(error.message.includes('403')
          ? 'Cloudinary API Secret ভুল বা পুরোনো—নতুন Secret বসান'
          : `ফাইল পাঠানো যায়নি: ${error.message}`);
      }
    }

    attachmentFileInput.addEventListener('change', () => {
      const file = attachmentFileInput.files && attachmentFileInput.files[0];
      if (file) sendAttachment(file);
      attachmentFileInput.value = '';
    });
    document.querySelectorAll('.attachment-option').forEach((option) => {
      option.addEventListener('click', () => {
        const type = option.dataset.attachment;
        if (type === 'document' || type === 'gallery') {
          attachmentFileInput.accept = type === 'gallery'
            ? 'image/*,video/*'
            : '.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt';
          attachmentFileInput.click();
          setAttachmentSheet(false);
          return;
        }
        const labels = {
          catalog: 'ক্যাটালগ শেয়ার করার ফিচারটি শীঘ্রই আসছে',
          order: 'দ্রুত অর্ডার তৈরি করার অপশনটি শীঘ্রই আসছে',
          location: 'লোকেশন শেয়ার করার অনুমতি দিন',
          contact: 'পরিচিতি শেয়ার করার ফিচারটি শীঘ্রই আসছে',
          payment: 'পেমেন্ট রিকোয়েস্ট ফিচারটি শীঘ্রই আসছে',
          event: 'ইভেন্ট তৈরি করার ফিচারটি শীঘ্রই আসছে'
        };
        setAttachmentSheet(false);
        showAttachmentNotice(labels[type] || 'এই অপশনটি শীঘ্রই আসছে');
      });
    });
    document.addEventListener('click', (event) => {
      if (attachmentSheet.classList.contains('is-open')
        && !attachmentSheet.contains(event.target)
        && !attachmentToggle.contains(event.target)) {
        setAttachmentSheet(false);
      }
      const contextMenu = document.getElementById('messageContextMenu');
      if (contextMenu && contextMenu.classList.contains('is-open')
        && !contextMenu.contains(event.target)
        && !event.target.closest('.msg-row')) {
        closeMessageContextMenu();
      }
    });
    document.getElementById('messageContextMenu').addEventListener('click', (event) => {
      const reactionButton = event.target.closest('[data-message-reaction]');
      if (reactionButton && Number.isInteger(contextMenuMessageIndex)) {
        toggleMessageReaction(contextMenuMessageIndex, reactionButton.dataset.messageReaction);
        closeMessageContextMenu();
        return;
      }
      const actionButton = event.target.closest('[data-message-action]');
      if (actionButton) handleMessageContextAction(actionButton.dataset.messageAction);
    });
    document.addEventListener('scroll', closeMessageContextMenu, true);

    const voiceToggleBtn = document.querySelector('.mode-btn[data-mode="voice"]');
    if (voiceToggleBtn) {
      voiceToggleBtn.addEventListener('click', () => {
        const composer = document.querySelector('.composer');
        const isVoiceMode = composer.dataset.mode === 'voice';
        playTabTone();
        setComposerMode(isVoiceMode ? 'text' : 'voice');
      });
    }

    const recordBtn = document.querySelector('.voice-record-btn');
    const replayBtn = document.querySelector('.voice-replay-btn');
    const deleteBtn = document.querySelector('.voice-delete-btn');

    recordBtn.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      if (mediaRecorder && mediaRecorder.state === 'recording') return;
      startVoiceRecording();
    });

    ['pointerup', 'pointerleave', 'touchend'].forEach((eventName) => {
      recordBtn.addEventListener(eventName, () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          stopVoiceRecording();
        }
      });
    });

    replayBtn.addEventListener('click', replayVoiceRecording);
    deleteBtn.addEventListener('click', deleteVoiceRecording);

    const messageInput = document.getElementById('messageInput');
    let typingResetTimer = null;

    messageInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
    messageInput.addEventListener('input', () => {
      const hasText = messageInput.value.trim().length > 0;
      updateTypingIndicator(hasText);
      clearTimeout(typingResetTimer);
      if (hasText) {
        playTypingTone();
        typingResetTimer = setTimeout(() => updateTypingIndicator(false), 1400);
      }
      if (!messageInput.value.trim() && activeReply) {
        activeReply = null;
        renderReplyPreview();
        messageInput.placeholder = 'Type a message...';
      }
    });

    async function initializeChat() {
      let unsubscribeAuth = () => {};
      const authenticatedUser = await new Promise(resolve => {
        unsubscribeAuth = firebase.auth().onAuthStateChanged(user => {
          unsubscribeAuth();
          resolve(user);
        });
      });
      const authenticatedEmail = authenticatedUser && authenticatedUser.email
        ? authenticatedUser.email.trim().toLowerCase()
        : '';
      if (authenticatedEmail && authenticatedEmail !== currentUserEmail) {
        localStorage.setItem('currentUserEmail', authenticatedEmail);
        localStorage.setItem('currentUserUid', authenticatedUser.uid || '');
        window.location.reload();
        return;
      }
      if (!currentUserEmail && !authenticatedEmail) {
        window.location.replace('index.html');
        return;
      }
      const cachedMessages = getMessages();
      renderMessages(cachedMessages);
      lastRenderedMessageIds = new Set(cachedMessages.map(message => message.id));
      const profileLoad = loadSenderProfiles();
      const memberLoad = loadSelectedMemberFromFirestore();
      const messageLoad = loadMessagesFromFirestore();
      renderMessages(cachedMessages);
      renderProfile();
      const [, , initialMessages] = await Promise.all([profileLoad, memberLoad, messageLoad]);
      renderMessages(initialMessages);
      lastRenderedMessageIds = new Set(initialMessages.map(message => message.id));
      requestBrowserNotifications();
      listenForMessages();
      listenForIncomingCalls();
    }

    renderProfile();
    initializeChat();
  </script>
