<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBRYMS Finance - Team Meet Chat</title>
  <style>
    :root {
      --bg: #050a10;
      --bg-2: #0d131a;
      --panel: rgba(13, 17, 22, 0.97);
      --panel-soft: rgba(25, 34, 39, 0.95);
      --accent: #5ae1d7;
      --accent-2: #4cc9f0;
      --highlight: #3ed7a7;
      --text: #edf6ff;
      --muted: #9bb0c9;
      --bubble-me: linear-gradient(135deg, #49caa2, #3fb9a0);
      --bubble-them: rgba(20, 31, 38, 0.98);
      --bubble-them-2: rgba(18, 27, 34, 0.96);
      --border: rgba(255,255,255,0.08);
      --composer: rgba(19, 25, 31, 0.97);
      --shadow: rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      font-family: 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at top, rgba(80,233,200,0.12), transparent 30%),
        linear-gradient(180deg, #02080d 0%, #030c12 100%);
      color: var(--text);
    }
    .app {
      width: min(100%, 430px);
      height: min(820px, calc(100vh - 36px));
      min-height: 0;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(6, 13, 18, 0.98), rgba(5, 11, 17, 0.98));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0,0,0,0.45);
      position: relative;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(10, 16, 22, 0.95);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .incoming-call {
      display: none;
      margin: 10px 14px 0;
      padding: 10px 12px;
      border: 1px solid rgba(90,225,215,0.35);
      border-radius: 12px;
      background: rgba(90,225,215,0.1);
      color: var(--text);
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .incoming-call button {
      border: none;
      border-radius: 999px;
      padding: 7px 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .incoming-call-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    .incoming-call .accept-call {
      background: var(--highlight);
      color: #032d22;
    }
    .incoming-call .reject-call {
      background: rgba(255, 91, 105, 0.18);
      color: #ff9ca6;
      border: 1px solid rgba(255, 91, 105, 0.45);
    }
    .back-btn {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 28px;
      cursor: pointer;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      flex-shrink: 0;
    }
    .profile-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 700; color: #fff;
      overflow: hidden;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .meta { min-width: 0; }
    .meta h1 { font-size: 17px; margin: 0; }
    .meta p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta p.profile-status.online { color: #4ade80; }
    .you-badge {
      display: inline-block;
      margin-left: 5px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(90, 225, 215, 0.16);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      vertical-align: middle;
    }
    .actions {
      display: flex; gap: 8px;
      margin-left: auto;
    }
    .btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }
    .btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background:
        linear-gradient(180deg, rgba(7, 16, 24, 0.76), rgba(8, 14, 20, 0.92)),
        radial-gradient(circle at center, rgba(44, 201, 245, 0.08), transparent 40%);
      min-height: 0;
    }
    .message-context-menu {
      display: none;
      position: absolute;
      z-index: 30;
      width: 196px;
      padding: 6px 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      background: #171717;
      box-shadow: 0 16px 38px rgba(0,0,0,0.48);
      overflow: hidden;
    }
    .message-context-menu.is-open { display: block; }
    .message-context-menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border: 0;
      background: transparent;
      color: #f4f4f4;
      text-align: left;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .message-context-menu button:hover,
    .message-context-menu button:focus-visible {
      background: rgba(255,255,255,0.09);
      outline: none;
    }
    .message-context-menu .menu-icon {
      width: 16px;
      color: #e8e8e8;
      text-align: center;
      flex-shrink: 0;
    }
    .message-context-menu .menu-icon svg {
      width: 16px;
      height: 16px;
      display: block;
      stroke: currentColor;
    }
    .message-context-menu [data-context-variant="own"] { display: none; }
    .message-context-menu.is-own [data-context-variant="other"] { display: none; }
    .message-context-menu.is-own [data-context-variant="own"] { display: flex; }
    .message-context-menu.is-own .message-reaction-row,
    .message-context-menu.is-own .message-emoji-picker { display: none; }
    .message-context-menu .menu-divider {
      height: 1px;
      margin: 5px 0;
      background: rgba(255,255,255,0.08);
    }
    .message-reaction-row {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 5px 8px 7px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .message-reaction-row button {
      width: 28px;
      height: 28px;
      justify-content: center;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
    }
    .message-reaction-row button:hover,
    .message-reaction-row button:focus-visible {
      background: rgba(255,255,255,0.14);
    }
    .message-emoji-picker {
      display: none;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      padding: 6px 8px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .message-emoji-picker.is-open { display: grid; }
    .message-emoji-picker button {
      width: 28px;
      height: 28px;
      justify-content: center;
      padding: 0;
      border-radius: 50%;
      font-size: 17px;
    }
    .msg-row.long-press-selected .bubble {
      outline: 2px solid rgba(90,225,215,0.8);
      outline-offset: 2px;
    }
    .msg-row {
      display: flex;
      width: 100%;
    }
    .msg-row.me { justify-content: flex-end; }
    .msg-row.them { justify-content: flex-start; }
    .message-stack {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: min(90%, 520px);
      width: fit-content;
    }
    .msg-row.me .message-stack {
      flex-direction: row-reverse;
      margin-left: auto;
    }
    .msg-row.them .message-stack {
      flex-direction: row;
      margin-right: auto;
    }
    .sender-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 10px;
      font-weight: 700;
    }
    .sender-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .group-message-profile {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 4px 2px;
      color: rgba(255,255,255,0.72);
      font-size: 11px;
      line-height: 1.1;
      font-weight: 600;
    }
    .group-message-profile .sender-avatar {
      width: 20px;
      height: 20px;
      font-size: 8px;
    }
    .bubble {
      display: inline-block;
      width: fit-content;
      max-width: min(84vw, 440px);
      min-width: 54px;
      padding: 8px 12px 6px;
      border-radius: 16px;
      line-height: 1.35;
      word-wrap: break-word;
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      position: relative;
      font-size: 15px;
    }
    .msg-row.me .bubble {
      background: var(--bubble-me);
      color: #072521;
      border-bottom-right-radius: 8px;
    }
    .msg-row.them .bubble {
      background: linear-gradient(180deg, rgba(24, 38, 46, 0.98), rgba(19, 31, 39, 0.95));
      color: var(--text);
      border-bottom-left-radius: 8px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .message-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 100%;
    }
    .reply-preview {
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 10px;
      border-left: 2px solid rgba(90, 225, 215, 0.9);
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }
    .composer .reply-preview {
      position: relative;
      padding-right: 34px;
    }
    .reply-cancel-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }
    .reply-cancel-btn:hover,
    .reply-cancel-btn:focus-visible {
      background: rgba(255,255,255,0.16);
      color: var(--text);
    }
    .reply-preview strong {
      font-size: 11px;
      opacity: 0.8;
      display: block;
      margin-bottom: 2px;
    }
    .typing-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .typing-indicator.visible {
      display: inline-flex;
    }
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 22px;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(90, 225, 215, 0.9);
      display: inline-block;
      animation: typingBlink 1.1s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBlink {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .bubble-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .reply-btn,
    .reaction-btn,
    .reaction-pill {
      border: none;
      background: rgba(255,255,255,0.08);
      color: inherit;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
    }
    .reaction-menu {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,0,0,0.12);
      border-radius: 999px;
      padding: 3px 4px;
      margin-left: 2px;
    }
    .message-reactions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .reaction-pill {
      background: rgba(255,255,255,0.12);
      padding: 4px 8px;
      font-size: 11px;
      line-height: 1;
    }
    .msg-row.me .reply-btn,
    .msg-row.me .reaction-btn,
    .msg-row.me .reaction-pill {
      background: rgba(7, 37, 33, 0.12);
    }
    .msg-row.them .reply-btn,
    .msg-row.them .reaction-btn,
    .msg-row.them .reaction-pill {
      background: rgba(255,255,255,0.06);
    }
    .bubble.voice-bubble {
      width: min(82%, 380px);
      max-width: 380px;
      padding: 10px 12px 8px;
      background: linear-gradient(135deg, rgba(18, 43, 38, 0.96), rgba(23, 69, 58, 0.96));
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 14px 28px rgba(5, 14, 20, 0.28);
      overflow: hidden;
    }
    .attachment-message {
      display: block;
      max-width: min(68vw, 300px);
      overflow: hidden;
      border-radius: 14px;
      background: rgba(0,0,0,0.14);
    }
    .attachment-message img,
    .attachment-message video {
      display: block;
      width: 100%;
      max-height: 280px;
      object-fit: cover;
    }
    .attachment-file {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      color: inherit;
      text-decoration: none;
      font-size: 12px;
    }
    .call-history {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 190px;
    }
    .call-history-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      font-size: 16px;
    }
    .call-history strong,
    .call-history span { display: block; }
    .call-history strong { font-size: 13px; }
    .call-history span { margin-top: 3px; font-size: 11px; opacity: 0.78; }
    .msg-row.them .bubble.voice-bubble {
      background: linear-gradient(180deg, rgba(31, 31, 31, 0.96), rgba(15, 15, 15, 0.98));
      border: 1px solid rgba(255,255,255,0.04);
    }
    .voice-clip {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      padding: 2px 0;
    }
    .voice-play {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.18);
      color: #dffdf8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .voice-bubble.is-playing .voice-play {
      background: rgba(95, 255, 197, 0.2);
      transform: scale(1.05);
    }
    .voice-bars {
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 3px;
      flex: 1;
      height: 28px;
      min-width: 0;
      padding: 2px 0;
    }
    .voice-bars span {
      display: block;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.42));
      height: var(--h, 18%);
      opacity: 0.96;
      transform-origin: bottom center;
      animation: voiceWave 1.1s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.08s);
    }
    .voice-bubble.is-playing .voice-bars span {
      animation-play-state: running;
    }
    .voice-bubble:not(.is-playing) .voice-bars span {
      animation-play-state: paused;
      opacity: 0.8;
    }
    .voice-duration {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      min-width: 42px;
      text-align: right;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    @keyframes voiceWave {
      0%, 100% { transform: scaleY(0.55); opacity: 0.45; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .time {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      opacity: 0.78;
      text-align: right;
    }
    .msg-row.them .time {
      text-align: left;
    }
    .message-status {
      margin-left: 4px;
      color: rgba(255,255,255,0.72);
    }
    .seen-by {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0;
      margin-top: 3px;
      min-height: 16px;
    }
    .seen-by-avatar {
      width: 16px;
      height: 16px;
      margin-left: -3px;
      border: 1px solid rgba(11,18,32,0.9);
      border-radius: 50%;
      overflow: hidden;
      background: var(--panel-soft);
    }
    .seen-by-avatar:first-child { margin-left: 0; }
    .seen-by-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .seen-by-more {
      margin-left: 4px;
      color: var(--muted);
      font-size: 9px;
    }
    .deleted-message {
      color: rgba(255,255,255,0.62);
      font-style: italic;
    }
    .composer {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 15px;
      background: rgba(13, 17, 22, 0.97);
      border-top: 1px solid rgba(255,255,255,0.06);
      position: relative;
      flex-shrink: 0;
      z-index: 5;
    }
    .composer-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .tool-btn {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }
    .tool-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }
    .attachment-sheet {
      display: none;
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(100% + 8px);
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      background: rgba(17, 25, 31, 0.98);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
      z-index: 4;
      animation: attachmentSheetIn 0.18s ease-out;
    }
    .attachment-sheet.is-open { display: block; }
    .attachment-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }
    .attachment-sheet-header strong { font-size: 13px; }
    .attachment-sheet-header span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }
    .attachment-close {
      width: 24px;
      height: 24px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    .attachment-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px 5px;
    }
    .attachment-option {
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 0;
      text-align: center;
      cursor: pointer;
      font: inherit;
    }
    .attachment-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 4px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 11px;
      background: rgba(255,255,255,0.025);
      color: var(--attachment-color, var(--accent));
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .attachment-icon svg { width: 19px; height: 19px; stroke: currentColor; }
    .attachment-option:hover .attachment-icon,
    .attachment-option:focus-visible .attachment-icon {
      transform: translateY(-2px);
      background: color-mix(in srgb, var(--attachment-color, var(--accent)) 15%, transparent);
    }
    .attachment-option span { display: block; font-size: 9px; color: #b9c7d4; }
    .attachment-notice {
      display: none;
      position: absolute;
      left: 50%;
      bottom: calc(100% + 12px);
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 9px 13px;
      border: 1px solid rgba(90,225,215,0.25);
      border-radius: 999px;
      background: rgba(10, 27, 31, 0.98);
      color: var(--text);
      font-size: 12px;
      z-index: 6;
    }
    .attachment-notice.is-visible { display: block; animation: attachmentSheetIn 0.18s ease-out; }
    @keyframes attachmentSheetIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .composer-input {
      flex: 1;
      position: relative;
      min-height: 44px;
    }
    .composer textarea,
    .voice-panel {
      width: 100%;
      min-height: 44px;
      max-height: 120px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      background: rgba(27, 33, 38, 0.96);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    .composer textarea {
      resize: none;
      padding: 12px 14px;
    }
    .composer textarea::placeholder {
      color: rgba(255,255,255,0.5);
    }
    .voice-panel {
      display: none;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      width: calc(100% - 24px);
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(100% + 8px);
      padding: 8px 10px 8px 8px;
      border-radius: 16px;
      background: rgba(22, 30, 35, 0.97);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 12px 22px rgba(0,0,0,0.22);
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-weight: 600;
      z-index: 2;
    }
    .voice-panel .voice-send-btn {
      margin-left: auto;
    }
    .voice-delete-btn,
    .voice-replay-btn,
    .voice-record-btn,
    .voice-send-btn {
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .voice-delete-btn,
    .voice-replay-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }
    .voice-replay-btn svg,
    .voice-delete-btn svg,
    .voice-record-btn svg,
    .voice-send-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }
    .voice-replay-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      stroke: none;
    }
    .voice-record-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255,255,255,0.07);
      color: var(--text);
      animation: pulse-record 1.4s ease-in-out infinite;
    }
    .voice-record-btn.is-recording {
      background: rgba(255, 82, 82, 0.14);
      color: #ff8d8d;
      border: 1px solid rgba(255, 120, 120, 0.5);
    }
    .voice-wave {
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 3px;
      flex: 1;
      min-width: 0;
      height: 22px;
      padding: 0 4px;
    }
    .voice-wave span {
      display: block;
      width: 3px;
      min-height: 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.38));
      animation: waveform 1.1s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.08s);
    }
    .voice-wave span:nth-child(odd) {
      opacity: 0.9;
    }
    .voice-timer {
      min-width: 44px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.04em;
    }
    .voice-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--highlight), #3cbf7c);
      color: #032d22;
      box-shadow: 0 10px 18px rgba(63, 214, 160, 0.25);
      opacity: 1;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .voice-send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    @keyframes pulse-record {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(90, 225, 215, 0.35);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 0 8px rgba(90, 225, 215, 0.08);
      }
    }
    @keyframes waveform {
      0%, 100% { height: 10%; opacity: 0.45; }
      50% { height: 100%; opacity: 1; }
    }
    .composer[data-mode="voice"] .voice-panel {
      display: flex;
    }
    .composer[data-mode="voice"] .composer textarea {
      display: block;
      opacity: 0.9;
    }
    .composer-input {
      flex: 1;
      position: relative;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .composer[data-mode="voice"] .mode-btn[data-mode="voice"] {
      background: rgba(90, 225, 215, 0.12);
      border-color: rgba(90, 225, 215, 0.4);
      color: var(--accent);
    }
    .composer[data-mode="text"] .mode-btn[data-mode="text"] {
      background: rgba(90, 225, 215, 0.12);
      border-color: rgba(90, 225, 215, 0.4);
      color: var(--accent);
    }
    .composer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .mode-btn {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }
    .mode-btn.active {
      background: rgba(90, 225, 215, 0.12);
      border-color: rgba(90, 225, 215, 0.4);
      color: var(--accent);
    }
    .mode-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }
    .send-btn {
      border: none;
      background: linear-gradient(135deg, var(--highlight), #3cbf7c);
      color: #032d22;
      border-radius: 18px;
      min-width: 52px;
      width: 52px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 10px 18px rgba(63, 214, 160, 0.25);
    }
    .composer[data-mode="voice"] .send-btn {
      display: inline-flex;
    }
    .send-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .app {
        height: calc(100dvh - 24px);
        min-height: 0;
      }
      .topbar { padding-left: 10px; padding-right: 10px; }
      .actions { gap: 6px; }
      .btn { width: 38px; height: 38px; }
      .messages { padding-left: 12px; padding-right: 12px; }
      .bubble { max-width: 90%; }
      .composer { padding-left: 10px; padding-right: 10px; }
      .attachment-sheet { left: 8px; right: 8px; padding: 10px 8px; }
      .attachment-icon { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button class="back-btn" aria-label="Back" onclick="window.location.href='team-meet.html'">←</button>
      <div class="profile-chip" id="profileChip"></div>
      <div class="actions">
        <button class="btn" type="button" onclick="openCall('audio')" aria-label="Audio call">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13 1.04.35 2.06.67 3.04A2 2 0 0 1 9.5 8.4L8.5 9.4a16 16 0 0 0 6.1 6.1l1-1a2 2 0 0 1 1.64-.92c.98.32 2 .54 3.04.67A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>
        <button class="btn" type="button" onclick="openCall('video')" aria-label="Video call">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="13" height="14" rx="2"/>
            <path d="M16 10.5 21 7v10l-5-3.5z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="incoming-call" id="incomingCall">
      <span id="incomingCallText">Incoming call</span>
      <div class="incoming-call-actions">
        <button class="accept-call" type="button" id="acceptIncomingCall">Accept</button>
        <button class="reject-call" type="button" id="rejectIncomingCall">Reject</button>
      </div>
    </div>
    <div id="typingIndicator" class="typing-indicator" aria-live="polite" hidden>
      <span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
      <span>Typing...</span>
    </div>

    <div class="messages" id="messages"></div>
    <div class="message-context-menu" id="messageContextMenu" role="menu" aria-hidden="true">
      <div class="message-reaction-row" data-context-variant="other" aria-label="React to message">
        <button type="button" data-message-reaction="💚" aria-label="React with green heart">💚</button>
        <button type="button" data-message-reaction="😄" aria-label="React with laughing face">😄</button>
        <button type="button" data-message-reaction="🎉" aria-label="React with party popper">🎉</button>
        <button type="button" data-message-reaction="😲" aria-label="React with surprised face">😲</button>
        <button type="button" data-message-reaction="😭" aria-label="React with crying face">😭</button>
        <button type="button" data-message-reaction="😡" aria-label="React with angry face">😡</button>
        <button type="button" data-message-action="more-reactions" aria-label="Add more reactions">＋</button>
      </div>
      <div class="message-emoji-picker" id="messageEmojiPicker" data-context-variant="other" aria-label="More reactions">
        <button type="button" data-message-reaction="👍" aria-label="React with thumbs up">👍</button>
        <button type="button" data-message-reaction="❤️" aria-label="React with red heart">❤️</button>
        <button type="button" data-message-reaction="😂" aria-label="React with tears of joy">😂</button>
        <button type="button" data-message-reaction="😍" aria-label="React with heart eyes">😍</button>
        <button type="button" data-message-reaction="🤔" aria-label="React with thinking face">🤔</button>
        <button type="button" data-message-reaction="👏" aria-label="React with clapping hands">👏</button>
        <button type="button" data-message-reaction="🔥" aria-label="React with fire">🔥</button>
        <button type="button" data-message-reaction="🙏" aria-label="React with folded hands">🙏</button>
        <button type="button" data-message-reaction="🥰" aria-label="React with smiling face with hearts">🥰</button>
        <button type="button" data-message-reaction="😎" aria-label="React with sunglasses">😎</button>
        <button type="button" data-message-reaction="✅" aria-label="React with check mark">✅</button>
        <button type="button" data-message-reaction="💯" aria-label="React with hundred points">💯</button>
      </div>
      <button type="button" data-context-variant="other" data-message-action="reply"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v2"/></svg></span><span>Reply</span></button>
      <button type="button" data-context-variant="both" data-message-action="copy"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="8" y="8" width="11" height="12" rx="1"/><path d="M5 16V5a1 1 0 0 1 1-1h9"/></svg></span><span>Copy</span></button>
      <button type="button" data-context-variant="both" data-message-action="forward"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="m14 7 5 5-5 5"/><path d="M19 12H5"/></svg></span><span>Forward</span></button>
      <button type="button" data-context-variant="own" data-message-action="edit"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="m4 16-.8 4.8L8 20l11-11a2.8 2.8 0 0 0-4-4z"/><path d="m13.5 6.5 4 4"/></svg></span><span>Edit</span></button>
      <button type="button" data-context-variant="other" data-message-action="pin"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="m8 4 8 8"/><path d="m14 3 7 7-4 1-3 5-2-2 5-3 1-4z"/><path d="m5 19 5-5"/></svg></span><span>Pin</span></button>
      <button type="button" data-context-variant="other" data-message-action="star"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg></span><span>Star</span></button>
      <button type="button" data-context-variant="other" data-message-action="note"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span>Add text to note</span></button>
      <div class="menu-divider"></div>
      <button type="button" data-context-variant="other" data-message-action="select"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 2.5 2.5L16 9"/></svg></span><span>Select</span></button>
      <button type="button" data-context-variant="other" data-message-action="report"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 4h12l-1 7H7z"/><path d="M7 11 5 20M17 11l2 9M9 15h6"/></svg></span><span>Report</span></button>
      <button type="button" data-context-variant="both" data-message-action="delete"><span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span><span>Delete</span></button>
    </div>

    <div class="composer" data-mode="text">
      <div class="composer-tools">
        <button class="tool-btn" id="attachmentToggle" type="button" aria-label="Open attachments" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 1 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L9.4 17.4a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/>
          </svg>
        </button>
        <input id="attachmentFileInput" type="file" hidden>
      </div>
      <div class="composer-input">
        <div class="attachment-sheet" id="attachmentSheet" aria-label="Attachment options">
          <div class="attachment-sheet-header">
            <div><strong>শেয়ার করুন</strong><span>আপনার প্রয়োজনীয় অপশন বেছে নিন</span></div>
            <button class="attachment-close" id="attachmentClose" type="button" aria-label="Close attachments">×</button>
          </div>
          <div class="attachment-grid">
            <button class="attachment-option" type="button" data-attachment="document" style="--attachment-color:#8b7bff"><span class="attachment-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span><span>ডকুমেন্ট</span></button>
            <button class="attachment-option" type="button" data-attachment="gallery" style="--attachment-color:#1598ff"><span class="attachment-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-4.5-4.5L8 19"/></svg></span><span>গ্যালারি</span></button>
            <button class="attachment-option" type="button" data-attachment="catalog" style="--attachment-color:#4e7681"><span class="attachment-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16v11H4zM3 9l2-5h14l2 5M8 13h8"/></svg></span><span>ক্যাটালগ</span></button>
            <button class="attachment-option" type="button" data-attachment="order" style="--attachment-color:#ffc33d"><span class="attachment-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-9 12h7l-1 8 9-12h-7z"/></svg></span><span>দ্রুত অর্ডার</span></button>
            <button class="attachment-option" type="button" data-attachment="location" style="--attachment-color:#10cda4"><span class="attachment-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span>লোকেশন</span></button>
            <button class="attachment-option" type="button" data-attachment="contact" style="--attachment-color:#20a4df"><span class="attachment-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"/></svg></span><span>পরিচিতি</span></button>
            <button class="attachment-option" type="button" data-attachment="payment" style="--attachment-color:#ffb938"><span class="attachment-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg></span><span>পেমেন্ট</span></button>
            <button class="attachment-option" type="button" data-attachment="event" style="--attachment-color:#ed3e8c"><span class="attachment-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M8 17h5"/></svg></span><span>ইভেন্ট</span></button>
          </div>
        </div>
        <div class="attachment-notice" id="attachmentNotice" role="status"></div>
        <div id="replyPreview" class="reply-preview" style="display:none;"></div>
        <textarea id="messageInput" placeholder="Type a message..."></textarea>
        <div class="voice-panel" aria-live="polite">
          <button class="voice-replay-btn" type="button" aria-label="Replay voice message" style="display:none;">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
          <div class="voice-wave" aria-hidden="true">
            <span style="--i:1; height: 30%;"></span>
            <span style="--i:2; height: 55%;"></span>
            <span style="--i:3; height: 80%;"></span>
            <span style="--i:4; height: 45%;"></span>
            <span style="--i:5; height: 90%;"></span>
            <span style="--i:6; height: 65%;"></span>
            <span style="--i:7; height: 100%;"></span>
            <span style="--i:8; height: 75%;"></span>
            <span style="--i:9; height: 50%;"></span>
            <span style="--i:10; height: 85%;"></span>
            <span style="--i:11; height: 60%;"></span>
            <span style="--i:12; height: 95%;"></span>
            <span style="--i:13; height: 70%;"></span>
            <span style="--i:14; height: 35%;"></span>
            <span style="--i:15; height: 80%;"></span>
            <span style="--i:16; height: 55%;"></span>
            <span style="--i:17; height: 90%;"></span>
            <span style="--i:18; height: 40%;"></span>
          </div>
          <div class="voice-timer">00:00</div>
          <button class="voice-record-btn" type="button" aria-label="Record voice message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
              <path d="M19 11a7 7 0 0 1-14 0"/>
              <path d="M12 18v3"/>
              <path d="M8 21h8"/>
            </svg>
          </button>
          <button class="voice-delete-btn" type="button" aria-label="Delete voice message" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18"/>
              <path d="M8 6V4h8v2"/>
              <path d="M19 6l-1 14H6L5 6"/>
            </svg>
          </button>
          <button class="voice-send-btn" type="button" aria-label="Send voice message" onclick="sendVoiceMessage()" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2 11 13"/>
              <path d="M22 2 15 22l-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="composer-right">
        <button class="mode-btn" type="button" data-mode="voice" aria-label="Voice mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
            <path d="M19 11a7 7 0 0 1-14 0"/>
            <path d="M12 18v3"/>
            <path d="M8 21h8"/>
          </svg>
        </button>
        <button class="send-btn" type="button" aria-label="Send message" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2 11 13"/>
            <path d="M22 2 15 22l-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

      const initialsText = initials(name);

          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">

    function getSavedProfileAccount(email) {

    async function loadSenderProfiles() {
        if (!isGroupChat) return;
        try {
            const snapshot = await db.collection('users').limit(100).get();
          snapshot.docs.forEach(doc => {
            const data = doc.data();

    function getPresenceDate(value) {
      if (!value) return null;
      if (typeof value.toDate === 'function') return value.toDate();
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function formatPresence(member) {
      const lastSeen = getPresenceDate(member.lastSeen);
      if (member.presenceStatus === 'online'
        && lastSeen
        && Date.now() - lastSeen.getTime() <= 90000
        && navigator.onLine) return 'Online';
      if (!lastSeen) return 'Offline';
      const minutes = Math.max(0, Math.floor((Date.now() - lastSeen.getTime()) / 60000));
      if (minutes < 1) return 'Last seen just now';
      if (minutes < 60) return `Last seen ${minutes} min ago`;
      if (minutes < 1440) return `Last seen ${Math.floor(minutes / 60)} hr ago`;
      if (minutes < 10080) return `Last seen ${Math.floor(minutes / 1440)} days ago`;
      return `Last seen ${lastSeen.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' })}`;
    }

    function isMessageFromCurrentUser(message = {}) {
      const senderEmail = String(message.senderEmail || '').trim().toLowerCase();
      if (senderEmail) {
        return Boolean(currentUserEmail && senderEmail === currentUserEmail);
      }
      if (message.self === true) return true;
      const senderValue = (message.sender || '').toString().trim().toLowerCase();
      if (senderValue === 'me' || senderValue === 'self') return true;
      if (message.senderName && /^(you|me)$/i.test(String(message.senderName).trim())) return true;
      return false;

    function playMessageTone({ frequency = 880, duration = 0.12, delay = 0, volume = 0.04, type = 'triangle', attack = 0.01, release = 0.09 } = {}) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        if (!window.sbrymsCallAudioContext) {
          window.sbrymsCallAudioContext = new AudioContextClass();
        }
        const context = window.sbrymsCallAudioContext;
        if (context.state === 'suspended') context.resume().catch(error => console.warn('Audio context resume failed:', error));
        const oscillator = context.createOscillator();
        const gainNode = context.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;
        gainNode.gain.value = 0;

        oscillator.connect(gainNode);
        gainNode.connect(context.destination);

        const startAt = context.currentTime + delay;
        gainNode.gain.setValueAtTime(0, startAt);
        gainNode.gain.linearRampToValueAtTime(volume, startAt + attack);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, startAt + duration + release);

        oscillator.start(startAt);
        oscillator.stop(startAt + duration + release);

        oscillator.onended = () => {
          setTimeout(() => {
            // Keep the shared context available for the next incoming call.
          }, 40);
        };
      } catch (error) {
        console.warn('Audio tone could not be played:', error);
      }

      ['pointerdown', 'touchstart', 'keydown'].forEach(eventName => {
        document.addEventListener(eventName, () => {
          if (window.sbrymsCallAudioContext && window.sbrymsCallAudioContext.state === 'suspended') {
            window.sbrymsCallAudioContext.resume().catch(error => console.warn('Audio context unlock failed:', error));
          }
        }, { once: true, passive: true });
      });
    }

    let incomingCallToneTimer = null;
    let incomingCallAudio = null;
    let incomingCallToneStartedAt = 0;
    let incomingCallExpiryTimer = null;
    let activeIncomingCallId = null;

    function stopIncomingCallTone() {
      if (incomingCallToneTimer) {
        clearInterval(incomingCallToneTimer);
        incomingCallToneTimer = null;
      }
      incomingCallToneStartedAt = 0;
      if (incomingCallExpiryTimer) {
        clearTimeout(incomingCallExpiryTimer);
        incomingCallExpiryTimer = null;
      }
      if (incomingCallAudio) {
        incomingCallAudio.pause();
        incomingCallAudio.currentTime = 0;
        incomingCallAudio = null;
      }
    }

    function startIncomingCallTone() {
      if (incomingCallToneTimer || incomingCallAudio) return;
      incomingCallToneStartedAt = Date.now();
      const savedRingtone = localStorage.getItem('callRingtone');
      const selectedRingtone = ['dj-jazz-2', 'uploaded-1', 'uploaded-2'].includes(savedRingtone) ? savedRingtone : 'uploaded-1';
      localStorage.setItem('callRingtone', selectedRingtone);
      const uploadedRingtones = {
        'uploaded-1': 'assets/ringtone-upload-1.mp3',
        'uploaded-2': 'assets/ringtone-upload-2.mp3'
      };
      if (uploadedRingtones[selectedRingtone]) {
        incomingCallAudio = new Audio(uploadedRingtones[selectedRingtone]);
        incomingCallAudio.loop = true;
        incomingCallAudio.volume = 0.7;
        incomingCallAudio.play().catch(error => {
          console.warn('Uploaded ringtone could not play; using built-in fallback:', error);
          incomingCallAudio = null;
          playMessageTone({ frequency: 660, duration: 0.3, volume: 0.05, type: 'sine' });
          incomingCallToneTimer = setInterval(() => {
            playMessageTone({ frequency: 660, duration: 0.3, volume: 0.05, type: 'sine' });
            setTimeout(() => playMessageTone({ frequency: 880, duration: 0.3, volume: 0.04, type: 'sine' }), 360);
          }, 1800);
        });
        return;
      }
      const ring = () => {
        const patterns = { 'dj-jazz-2': [392, 493.88, 587.33, 659.25, 587.33] };
        const selected = localStorage.getItem('callRingtone') || 'dj-jazz-2';
        const frequencies = patterns[selected] || patterns['dj-jazz-2'];
        const notes = frequencies.map((frequency, index) => ({
          frequency,
          delay: index < 3 ? index * 120 : 560 + (index - 3) * 120,
          duration: index === 2 || index === 4 ? 0.42 : 0.28
        }));
        notes.forEach(note => setTimeout(() => playMessageTone({
          frequency: note.frequency,
          duration: note.duration,
          volume: 0.014,
          type: 'sine',
          attack: 0.04,
          release: 0.18
        }), note.delay));
      };
      ring();
      incomingCallToneTimer = setInterval(ring, 2600);
    }

    function showMessageNotification(message) {
      playIncomingMessageTone();
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const notification = new Notification(message.senderName || selectedMember.name || 'New message', {
        body: message.deleted ? 'Message deleted' : (message.text || 'New voice message'),
        icon: selectedMember.photo || buildAvatarSvg(message.senderName || selectedMember.name || 'User'),
        tag: `team-meet-${conversationId}`
      });
      notification.onclick = () => {
        window.focus();
        notification.close();
      };
    }

    function markIncomingMessagesRead(messages) {
      if (isGroupChat || !currentUserEmail) return messages;
      const now = new Date().toISOString();
      let changed = false;
      const updated = messages.map(message => {
        if (isMessageFromCurrentUser(message) || message.deleted || message.status === 'seen') return message;
        changed = true;
        return { ...message, status: 'seen', readAt: message.readAt || now };
      });
      if (changed) saveMessages(updated);
      return updated;
    }

    function getGroupReadProfile() {
      const profile = getCurrentSenderProfile();
      return {
        name: profile.name,
        photo: profile.photo || buildAvatarSvg(profile.name)
      };
    }

    function markGroupMessagesSeen(messages) {
      if (!isGroupChat || !currentUserEmail) return messages;
      const profile = getGroupReadProfile();
      const latestVisibleIndex = messages.reduce((lastIndex, message, index) =>
        message && !message.deleted ? index : lastIndex, -1);
      if (latestVisibleIndex < 0) return messages;
      let changed = false;
      const updated = messages.map((message, index) => {
        const readBy = Array.isArray(message.readBy)
          ? Object.fromEntries(message.readBy.map(item => [item.email, item]))
          : { ...(message.readBy || {}) };
        if (readBy[currentUserEmail] && index !== latestVisibleIndex) {
          delete readBy[currentUserEmail];
          changed = true;
        }
        if (index === latestVisibleIndex
          && (!readBy[currentUserEmail]
            || readBy[currentUserEmail].name !== profile.name
            || readBy[currentUserEmail].photo !== profile.photo)) {
          readBy[currentUserEmail] = { email: currentUserEmail, ...profile };
          changed = true;
        }
        return { ...message, readBy };
      });
      if (!changed) return updated;
      saveMessages(updated);
      return updated;
    }

    function markPrivateMessagesSeen(messages) {
      if (isGroupChat || !currentUserEmail) return messages;
      const profile = getGroupReadProfile();
      const latestIncomingIndex = messages.reduce((lastIndex, message, index) =>
        !isMessageFromCurrentUser(message) && !message.deleted ? index : lastIndex, -1);
      if (latestIncomingIndex < 0) return messages;
      let changed = false;
      const updated = messages.map((message, index) => {
        const readBy = { ...(message.readBy || {}) };
        if (!isMessageFromCurrentUser(message) && readBy[currentUserEmail] && index !== latestIncomingIndex) {
          delete readBy[currentUserEmail];
          changed = true;
        }
        if (index === latestIncomingIndex
          && (!readBy[currentUserEmail]
            || readBy[currentUserEmail].name !== profile.name
            || readBy[currentUserEmail].photo !== profile.photo)) {
          readBy[currentUserEmail] = { email: currentUserEmail, ...profile };
          changed = true;
        }
        return { ...message, readBy };
      });
      if (!changed) return updated;
      saveMessages(updated);
      return updated;
    }

    function renderSeenBy(message, isMe) {
      if (!message.readBy) return '';
      const readers = Object.values(message.readBy)
        .filter(reader => reader && reader.email && reader.email !== currentUserEmail)
        .slice(-5);
      if (!readers.length) return '';
      const avatars = readers.map(reader => {
        const profile = senderProfiles.get(String(reader.email).toLowerCase()) || {};
        const name = reader.name || profile.name || 'Member';
        const photo = reader.photo || profile.photo || buildAvatarSvg(name);
        return `<span class="seen-by-avatar" title="${name}"><img src="${photo}" alt="${name}"></span>`;
      }).join('');
      const more = Object.keys(message.readBy).length - 1 > readers.length
        ? `<span class="seen-by-more">+${Object.keys(message.readBy).length - 1 - readers.length}</span>`
        : '';
      return `<div class="seen-by" aria-label="Seen by ${readers.map(reader => reader.name || reader.email).join(', ')}">${avatars}${more}</div>`;
    }

    async function loadMessagesFromFirestore() {
      try {
        const snapshot = await conversationRef.get();
        const firestoreMessages = snapshot.exists ? (snapshot.data().messages || []) : [];
        const localMessages = getMessages();
        const firestoreIds = new Set(firestoreMessages.map(message => message.id));
        const mergedMessages = [
          ...firestoreMessages,
          ...localMessages.filter(message => !firestoreIds.has(message.id))
        ];
        if (mergedMessages.length) {
          localStorage.setItem(storageKey, JSON.stringify(mergedMessages));
          if (mergedMessages.length > firestoreMessages.length) saveMessages(mergedMessages);
          return mergedMessages;
        }

        const fallbackMessages = getMessages();
        await conversationRef.set({
          conversationId,
          participants: [currentUserEmail, selectedMember.email].filter(Boolean),
          messages: fallbackMessages,
          updatedAt: new Date()
        }, { merge: true });
        localStorage.setItem(storageKey, JSON.stringify(fallbackMessages));
        return fallbackMessages;
      } catch (error) {
        console.error('Error loading messages from Firestore:', error);
        return getMessages();
      }
    }

    let messageWriteQueue = Promise.resolve();
    function saveMessages(messages) {
      localStorage.setItem(storageKey, JSON.stringify(messages));
      messageWriteQueue = messageWriteQueue
        .catch(error => console.error('Previous message write failed:', error))
        .then(() => db.runTransaction(async transaction => {
          const snapshot = await transaction.get(conversationRef);
          const latest = snapshot.exists ? (snapshot.data().messages || []) : [];
          const desiredById = new Map(messages.map(message => [message.id, message]));
          const latestById = new Map(latest.map(message => [message.id, message]));
          desiredById.forEach((message, id) => latestById.set(id, message));
          transaction.set(conversationRef, {
            conversationId,
            participants: [currentUserEmail, selectedMember.email].filter(Boolean),
            messages: Array.from(latestById.values()),
            updatedAt: new Date()
          }, { merge: true });
        }))
        .catch(error => console.error('Failed to save messages to Firestore:', error));
      return messageWriteQueue;
    }

    function saveNewMessage(message) {
      localStorage.setItem(storageKey, JSON.stringify([...getMessages(), message]));
      conversationRef.set({
        conversationId,
        participants: [currentUserEmail, selectedMember.email].filter(Boolean),
        messages: firebase.firestore.FieldValue.arrayUnion(message),
        updatedAt: new Date()
      }, { merge: true })
        .catch(error => {
          console.error('Failed to deliver new message:', error);
          showAttachmentNotice('Message could not be delivered. Please try again.');
        });
    }

    function createInAppNotification({ to, type, title, message, from }) {
      const recipient = String(to || '').trim().toLowerCase();
      if (!recipient || recipient === currentUserEmail || !db) return;
      db.collection('notifications').add({
        to: recipient,
        from: from || currentUserEmail,
        type,
        title,
        message,
        read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(error => console.error('Failed to create in-app notification:', error));
    }

    function cancelReply() {
      activeReply = null;
      renderReplyPreview();
      const input = document.getElementById('messageInput');
      if (input) {
        input.placeholder = 'Type a message...';
        input.focus();
      }
    }

    function renderReplyPreview() {
      const replyPreview = document.getElementById('replyPreview');
      if (!replyPreview) return;
      if (!activeReply) {
        replyPreview.style.display = 'none';
        replyPreview.innerHTML = '';
        return;
      }
      replyPreview.style.display = 'block';
      replyPreview.innerHTML = `
        <button type="button" class="reply-cancel-btn" id="replyCancel" aria-label="Cancel reply">×</button>
        <strong>Replying to ${activeReply.senderName}</strong>
        <div>${activeReply.text}</div>
      `;
      document.getElementById('replyCancel').addEventListener('click', cancelReply);
    }

    function replyToMessageAtIndex(index) {
      const messages = getMessages();
      const target = messages[index];
      if (!target || target.deleted) return;
      activeReply = {
        text: target.text || 'Voice message',
        senderName: isMessageFromCurrentUser(target) ? 'You' : (target.senderName || selectedMember.name || 'Contact'),
        messageIndex: index
      };
      renderReplyPreview();
      const input = document.getElementById('messageInput');
      if (input) {
        input.focus();
        input.placeholder = 'Replying...';
      }
    }

    let contextMenuMessageIndex = null;

    function closeMessageContextMenu() {
      const menu = document.getElementById('messageContextMenu');
      if (!menu) return;
      menu.classList.remove('is-open');
      menu.classList.remove('is-own');
      menu.setAttribute('aria-hidden', 'true');
      document.querySelectorAll('.long-press-selected').forEach(row => row.classList.remove('long-press-selected'));
      contextMenuMessageIndex = null;
    }

    function openMessageContextMenu(index, clientX, clientY, row) {
      const menu = document.getElementById('messageContextMenu');
      const app = document.querySelector('.app');
      if (!menu || !app) return;
      contextMenuMessageIndex = index;
      const message = getMessages()[index];
      menu.classList.toggle('is-own', isMessageFromCurrentUser(message));
      menu.classList.add('is-open');
      menu.setAttribute('aria-hidden', 'false');
      if (row) row.classList.add('long-press-selected');
      const appRect = app.getBoundingClientRect();
      const menuWidth = menu.offsetWidth;
      const menuHeight = menu.offsetHeight;
      const left = Math.max(8, Math.min(clientX - appRect.left, appRect.width - menuWidth - 8));
      const top = Math.max(8, Math.min(clientY - appRect.top, appRect.height - menuHeight - 8));
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
    }

    function deleteMessageAtIndex(index) {
      const messages = getMessages();
      const target = messages[index];
      if (!target) return;
      target.deleted = true;
      target.text = '';
      target.audioDataUrl = '';
      target.fileUrl = '';
      target.deletedAt = new Date().toISOString();
      saveMessages(messages);
      closeMessageContextMenu();
      renderMessages(messages);
    }

    function handleMessageContextAction(action) {
      const index = contextMenuMessageIndex;
      const messages = getMessages();
      const target = Number.isInteger(index) ? messages[index] : null;
      if (!target) return closeMessageContextMenu();
      if (action === 'more-reactions') {
        document.getElementById('messageEmojiPicker').classList.toggle('is-open');
        return;
      }
      const messageText = target.text || 'Voice message';
      closeMessageContextMenu();
      if (action === 'reply') {
        replyToMessageAtIndex(index);
      } else if (action === 'copy') {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(messageText).then(() => showAttachmentNotice('Message copied')).catch(error => {
            console.error('Could not copy message:', error);
            showAttachmentNotice('Copy করা যায়নি');
          });
        } else {
          showAttachmentNotice('Copy করা যায়নি');
        }
      } else if (action === 'delete') {
        deleteMessageAtIndex(index);
      } else if (action === 'edit') {
        if (target.deleted || target.type !== 'text' && target.type !== undefined) {
          showAttachmentNotice('এই মেসেজটি edit করা যাবে না');
          return;
        }
        editingMessageIndex = index;
        const input = document.getElementById('messageInput');
        input.value = target.text || '';
        input.placeholder = 'Edit message...';
        input.focus();
      } else if (action === 'pin' || action === 'star' || action === 'note') {
        const propertyName = { pin: 'pinned', star: 'starred', note: 'noted' }[action];
        target[propertyName] = !target[propertyName];
        saveMessages(messages);
        renderMessages(messages);
        showAttachmentNotice(`${action === 'pin' ? 'Message pinned' : action === 'star' ? 'Message starred' : 'Note updated'}`);
      } else if (action === 'select') {
        const row = document.querySelector(`[data-message-index="${index}"]`);
        if (row) row.classList.add('long-press-selected');
        showAttachmentNotice('Message selected');
      } else if (action === 'forward') {
        showAttachmentNotice('Forward অপশনটি শীঘ্রই আসছে');
      } else if (action === 'report') {
        showAttachmentNotice('Message reported');
      }
    }

    function renderMessages(messages = getMessages()) {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = messages.map((msg, index) => {
        const isMe = isMessageFromCurrentUser(msg);
        const replyMarkup = msg.replyTo ? `
          <div class="reply-preview">
            <strong>Replying to ${msg.replyTo.senderName || 'message'}</strong>
            <div>${msg.replyTo.text}</div>
          </div>
        ` : '';
        if (msg.type === 'voice') {
          return `
            <div class="msg-row ${isMe ? 'me' : 'them'}" data-message-index="${index}">
              <div class="message-card">
                ${renderGroupSenderProfile(msg, isMe)}
                <div class="bubble voice-bubble">
                  <div class="voice-clip">
                    <button class="voice-play" type="button" aria-label="Play voice message" data-duration="${Number(msg.durationSeconds || 5)}" data-duration-label="${msg.duration || '00:05'}" data-index="${index}" data-audio-url="${encodeURIComponent(msg.audioDataUrl || '')}">▶</button>
                    <div class="voice-bars">${makeVoiceBars(msg.duration || '00:05')}</div>
                    <span class="voice-duration">${msg.duration || '00:05'}</span>
                  </div>
                  <span class="time">${msg.time}</span>
