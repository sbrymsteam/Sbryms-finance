<!DOCTYPE html>
<html lang="bn">
<head>
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/app-icon-192.png?v=22">
  <link rel="apple-touch-icon" href="/assets/app-icon-192.png?v=22">
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBRYMS Finance - Team Meet Call</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #151f2f;
      --panel-2: #1a2740;
      --accent: #2cc9f5;
      --accent-2: #ff4db8;
      --danger: #ff4f6d;
      --text: #edf6ff;
      --muted: #9bb0c9;
      --border: rgba(255,255,255,0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 10%, rgba(44,201,245,0.18), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(255,77,184,0.12), transparent 28%),
        #050a12;
      color: var(--text);
    }
    .call-shell {
      width: min(100%, 460px);
      min-height: min(760px, calc(100vh - 36px));
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(9, 20, 31, 0.98), rgba(8, 14, 24, 0.98)),
        radial-gradient(circle at 50% 30%, rgba(44,201,245,0.1), transparent 42%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 28px 90px rgba(0,0,0,0.5), inset 0 1px rgba(255,255,255,0.05);
    }

    body.audio-call {
      background:
        radial-gradient(ellipse at 50% 34%, rgba(35, 122, 102, 0.3), transparent 38%),
        radial-gradient(circle at 12% 90%, rgba(23, 91, 83, 0.16), transparent 34%),
        #07120f;
    }
    body.audio-call .call-shell {
      background:
        radial-gradient(ellipse at 50% 38%, rgba(29, 103, 84, 0.2), transparent 46%),
        linear-gradient(180deg, #0d1a17, #07110f 72%);
      border-color: rgba(130, 205, 178, 0.12);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 10px;
    }
    .back-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      font-size: 20px;
      cursor: pointer;
    }
    .call-type {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(90,225,215,0.24);
      font-size: 12px;
      color: var(--accent);
      background: rgba(90,225,215,0.08);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .profile {
      text-align: center;
      padding: 22px 18px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .video-grid {
      display: none;
      padding: 0 18px 12px;
      position: relative;
    }
    .video-grid.active { display: block; }
    .video-grid video {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 14px;
      background: #05080d;
    }
    .video-grid #localVideo {
      position: absolute;
      z-index: 2;
      top: 10px;
      right: 28px;
      width: 92px;
      height: 122px;
      aspect-ratio: auto;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.45);
    }
    .video-grid:not(.connected) #localVideo { display: none; }
    .video-grid:not(.connected) #remoteVideo { visibility: hidden; }
    .avatar {
      width: 109px; height: 109px; aspect-ratio: 1 / 1; border-radius: 50%;
      margin: 0 auto 10px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: 3px solid rgba(130, 235, 211, 0.82);
      font-size: 26px; font-weight: 700;
      box-shadow: 0 0 0 5px rgba(90,225,215,0.05), 0 0 0 10px rgba(90,225,215,0.025), 0 14px 30px rgba(44,201,245,0.16);
      animation: avatarPulse 2.8s ease-in-out infinite;
      overflow: hidden;
      flex-shrink: 0;
    }
    body.audio-call .avatar {
      width: clamp(132px, 38vw, 174px);
      height: auto;
      aspect-ratio: 1;
      margin-bottom: 24px;
      box-shadow: 0 0 0 8px rgba(55, 190, 143, 0.07), 0 0 0 18px rgba(55, 190, 143, 0.035), 0 18px 48px rgba(0,0,0,0.4);
    }
    body.audio-call.call-connecting .avatar {
      animation: audioCallPulse 2.2s ease-in-out infinite;
    }
    body.audio-call.call-connected .avatar {
      animation: none;
      box-shadow: 0 0 0 7px rgba(74, 222, 128, 0.09), 0 0 0 15px rgba(74, 222, 128, 0.035), 0 18px 48px rgba(0,0,0,0.4);
    }
    @keyframes audioCallPulse {
      0%, 100% { box-shadow: 0 0 0 8px rgba(55, 190, 143, 0.07), 0 0 0 18px rgba(55, 190, 143, 0.035), 0 18px 48px rgba(0,0,0,0.4); }
      50% { box-shadow: 0 0 0 12px rgba(55, 190, 143, 0.11), 0 0 0 25px rgba(55, 190, 143, 0.045), 0 20px 52px rgba(0,0,0,0.44); }
    }
    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      clip-path: circle(50%);
      background: #050a12;
    }
    @keyframes avatarPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 5px rgba(90,225,215,0.05), 0 0 0 10px rgba(90,225,215,0.025), 0 14px 30px rgba(44,201,245,0.16); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 7px rgba(90,225,215,0.06), 0 0 0 13px rgba(90,225,215,0.02), 0 16px 34px rgba(44,201,245,0.2); }
    }
    .name {
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 700;
      margin: 0;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status {
      color: var(--muted);
      margin: 11px 0 0;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.72;
    }
    body.call-connecting .status::before {
      background: #f4c76b;
      box-shadow: 0 0 0 4px rgba(244, 199, 107, 0.1);
      animation: statusPulse 1.4s ease-in-out infinite;
    }
    body.call-connected .status::before {
      background: #4ade80;
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.1);
    }
    body.call-connected .status {
      color: #a7e8ba;
    }
    body.call-error .status {
      color: #ff8291;
    }
    body.call-error .status::before {
      background: #ff6b7b;
      box-shadow: 0 0 0 4px rgba(255, 107, 123, 0.1);
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .timer {
      display: none;
      margin-top: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .timer.is-active {
      display: block;
      text-shadow: 0 0 14px rgba(44,201,245,0.45);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      justify-items: center;
      align-items: start;
      gap: 20px 12px;
      margin: 0 16px 16px;
      padding: 22px 14px max(24px, env(safe-area-inset-bottom));
      border: 1px solid rgba(255,255,255,0.055);
      border-radius: 30px;
      background: rgba(15, 22, 25, 0.94);
      box-shadow: 0 16px 45px rgba(0,0,0,0.28);
    }
    .more-menu .video-control { display: none; }
    body.video-call .more-menu .video-control { display: inline-flex; }
    .control-btn {
      width: 100%;
      max-width: 90px;
      min-height: 90px;
      border: 0;
      border-radius: 24px;
      background: transparent;
      color: var(--text);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .control-btn:hover {
      transform: translateY(-2px) scale(1.02);
      background: rgba(255,255,255,0.06);
    }
    .control-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    .control-btn:disabled:hover { transform: none; background: transparent; }
    .control-btn.is-active {
      color: #0c1114;
      background: #f5f7f8;
    }
    .control-btn.is-active .control-label {
      color: #263138;
    }
    .control-btn svg {
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
    }
    .control-label {
      color: rgba(237,246,255,0.86);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
    }
    .control-btn.end {
      width: 76px;
      min-height: 76px;
      justify-self: center;
      border-radius: 50%;
      background: #e9003d;
      box-shadow: 0 10px 24px rgba(233,0,61,0.22);
    }
    .control-btn.end:hover { background: #f01850; }
    .control-btn.end svg { transform: rotate(135deg); }
    .more-menu {
      grid-column: 1 / -1;
      width: 100%;
      max-width: 340px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    .more-menu[hidden] { display: none; }
    .more-menu button {
      margin-top: 10px;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .panel {
      padding: 14px 18px 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.025);
    }
    body.direct-call #callModeDescription,
    body.direct-call .room-tools { display: none; }
    body.direct-call #callPanel:has(#roomInfo:empty) { display: none; }
    .room-tools {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .room-tools input,
    .room-tools button {
      min-height: 38px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 0 10px;
    }
    @media (max-width: 520px) {
      body { padding: 0; }
      .call-shell {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }
      body.audio-call .header { padding: max(20px, env(safe-area-inset-top)) 20px 10px; }
      body.audio-call .profile { padding: 12px 18px 20px; }
      .controls { margin: 0 16px max(16px, env(safe-area-inset-bottom)); }
    }
    .room-tools input { flex: 1; min-width: 0; }
    .room-tools button { cursor: pointer; }
    .call-result-actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
    .call-result-actions[hidden] { display: none; }
    .status.is-success { color: #4ade80; }
    .status.is-error { color: #ff6b7b; }
    html:root:root body:not(#sbryms-theme-specificity-anchor) .status.is-success { color: #4ade80 !important; }
    html:root:root body:not(#sbryms-theme-specificity-anchor) .status.is-error { color: #ff6b7b !important; }
    .call-result-actions button {
      border: 1px solid rgba(255,255,255,0.16); border-radius: 999px;
      padding: 9px 16px; background: rgba(255,255,255,0.08); color: var(--text);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    html:root:root body.video-call {
      min-height: 100dvh;
      padding: 0;
    }
    html:root:root body.video-call .call-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      max-width: none;
      border: 0;
      border-radius: 0;
    }
    html:root:root body.video-call .header {
      position: absolute;
      z-index: 4;
      top: 0;
      left: 0;
      right: 0;
      padding: max(16px, env(safe-area-inset-top)) 20px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.48), transparent);
    }
    html:root:root body.video-call .video-grid.active {
      position: absolute;
      z-index: 1;
      inset: 0;
      padding: 0;
    }
    html:root:root body.video-call .video-grid #remoteVideo {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
    }
    html:root:root body.video-call .video-grid #localVideo {
      top: max(76px, calc(env(safe-area-inset-top) + 60px));
      right: 16px;
      width: min(28vw, 128px);
      height: auto;
      aspect-ratio: 3 / 4;
    }
    html:root:root body.video-call.video-connected .profile {
      position: absolute;
      z-index: 3;
      top: max(68px, calc(env(safe-area-inset-top) + 54px));
      left: 12px;
      right: 12px;
      flex: 0 0 auto;
      padding: 10px 12px;
      text-align: left;
      align-items: flex-start;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    html:root:root body.video-call.video-connected .profile .avatar {
      display: none;
    }
    html:root:root body.video-call.video-connected .profile .status {
      margin-top: 4px;
    }
    html:root:root body.video-call.video-connected .controls {
      position: absolute;
      z-index: 4;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 16px;
      margin: 0;
      background: rgba(10, 16, 20, 0.78);
      backdrop-filter: blur(18px);
    }
    @media (max-width: 520px) {
      html:root:root body.video-call .call-shell {
        min-height: 100dvh;
      }
    }
  </style>

<body>
  <div class="call-shell">
    <div class="header">
      <button class="back-btn" id="callBackButton" type="button" aria-label="Back">←</button>
      <span class="call-type" id="callTypeBadge">Audio</span>
    </div>

    <div class="profile">
      <div class="avatar" id="avatar">A</div>
      <h1 class="name" id="targetName">Member</h1>
      <p class="status" id="callStatus">Dialing...</p>
      <div class="timer" id="timer">00:00</div>
      <div class="call-result-actions" id="callResultActions" hidden>
        <button type="button" id="retryCallButton">Try again</button>
        <button type="button" id="messageAfterCallButton">Message</button>
      </div>
    </div>
    <div class="video-grid" id="videoGrid">
      <video id="localVideo" autoplay muted playsinline></video>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div class="controls">
      <button class="control-btn is-active" type="button" aria-label="Audio" title="Turn incoming call audio on or off">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5a4 4 0 0 1 0 5M19.5 7a7.5 7.5 0 0 1 0 10"/>
        </svg>
        <span class="control-label">Audio</span>
      </button>
      <button class="control-btn" id="toggleVideoButton" type="button" aria-label="Turn video on" title="Turn camera on">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/>
        </svg>
        <span class="control-label">Video</span>
      </button>
      <button class="control-btn" type="button" aria-label="Mute" title="Mute microphone">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
        </svg>
        <span class="control-label">Mute</span>
      </button>
      <button class="control-btn" id="moreCallControls" type="button" aria-label="More call options" aria-expanded="false" aria-controls="moreCallMenu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>
        </svg>
        <span class="control-label">More</span>
      </button>
      <button class="control-btn" type="button" aria-label="Share screen" title="Share screen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 21v-7m-3 3 3-3 3 3"/>
        </svg>
        <span class="control-label">Share</span>
      </button>
      <button class="control-btn end" type="button" aria-label="End call">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M5 15.5c3.8-3.2 10.2-3.2 14 0"/><path d="M7.5 14.5 5 18M16.5 14.5 19 18"/>
        </svg>
        <span class="control-label">End</span>
      </button>
      <div class="more-menu" id="moreCallMenu" hidden>
        <span>Camera and call options.</span>
        <br>
        <button class="video-control" type="button" aria-label="Camera switch" title="Switch camera">Switch camera</button>
      </div>
    </div>

    <div class="panel" id="callPanel">
      <span id="callModeDescription">You are currently in a <strong id="callModeText">audio</strong> call.</span>
      <div id="roomInfo"></div>
    </div>
  </div>

    function playCallTone({ frequency, duration, volume, type = 'sine' }) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!window.sbrymsCallAudioContext) {
          window.sbrymsCallAudioContext = new AudioContextClass();
        }
        const context = window.sbrymsCallAudioContext;
        if (context.state === 'suspended') context.resume().catch(error => console.warn('Audio context resume failed:', error));
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        const startAt = context.currentTime;
        oscillator.type = type;
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(0, startAt);
        gain.gain.linearRampToValueAtTime(volume, startAt + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration);
      } catch (error) {
        console.warn('Call tone could not be played:', error);
      }
    }

    async function renegotiateDirectCallForVideo() {
      if (!directCallRef || !peerConnection || isGroupCall) {
        throw new Error('Video is not available in this call.');
      }
      if (peerConnection.signalingState !== 'stable' || pendingDirectNegotiation) {
        throw new Error('Another call update is in progress. Try again in a moment.');
      }

      const id = `video-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      let resolveResponse;
      let rejectResponse;
      const response = new Promise((resolve, reject) => {
        resolveResponse = resolve;
        rejectResponse = reject;
      });
      const timeout = setTimeout(() => {
        if (pendingDirectNegotiation && pendingDirectNegotiation.id === id) {
          pendingDirectNegotiation = null;
          rejectResponse(new Error('The other member did not accept the video update.'));
        }
      }, 15000);
      pendingDirectNegotiation = {
        id,
        processing: false,
        resolve: () => {
          clearTimeout(timeout);
          pendingDirectNegotiation = null;
          resolveResponse();
        },
        reject: error => {
          clearTimeout(timeout);
          pendingDirectNegotiation = null;
          rejectResponse(error);
        }
      };

      try {
        await directCallRef.update({
          renegotiation: {
            id,
            by: currentUserEmail,
            offer: { type: offer.type, sdp: offer.sdp }
          }
        });
        await response;
      } catch (error) {
        if (pendingDirectNegotiation && pendingDirectNegotiation.id === id) {
          clearTimeout(timeout);
          pendingDirectNegotiation = null;
        }
        if (peerConnection.signalingState === 'have-local-offer') {
          await peerConnection.setLocalDescription({ type: 'rollback' });
        }
        throw error;
      }
    }

    async function handleDirectRenegotiation(data) {
      const negotiation = data.renegotiation;
      if (!peerConnection || !directCallRef || !negotiation || !negotiation.id) return;
      if (negotiation.by === currentUserEmail) {
        const pending = pendingDirectNegotiation;
        if (!pending || pending.id !== negotiation.id || !negotiation.answer || pending.processing) return;
        pending.processing = true;
        try {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(negotiation.answer));
          pending.resolve();
        } catch (error) {
          pending.reject(error);
          throw error;
        }
        return;
      }

      if (!negotiation.offer || negotiation.id === lastRemoteNegotiationId) return;
      if (peerConnection.signalingState !== 'stable') {
        throw new Error('A simultaneous call update is already in progress.');
      }
      lastRemoteNegotiationId = negotiation.id;
      try {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(negotiation.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        await directCallRef.update({
          renegotiation: {
            id: negotiation.id,
            by: negotiation.by,
            offer: negotiation.offer,
            answer: {
              type: answer.type,
              sdp: answer.sdp
            }
          }
        });
      } catch (error) {
        lastRemoteNegotiationId = '';
        throw error;
      }
    }

    function listenToDirectCall(ref) {
      directCallUnsubscribe = ref.onSnapshot(async snapshot => {
        const data = snapshot.data();
        if (!data) return;
        if (data.status === 'ended') {
          handleRemoteCallEnded(data.endedReason || '').catch(error => {
            console.error('Could not finish the ended call:', error);
          });
          return;
        }
        try {
          if (callRole === 'caller' && data.answer && !peerConnection.currentRemoteDescription) {
            setCallStatus('Connecting...');
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            stopConnectingTone();
            stopIncomingTone();
            stopUnansweredCallTimer();
          }
          await handleDirectRenegotiation(data);
        } catch (error) {
          console.error('Call video update failed:', error);
          document.getElementById('roomInfo').textContent = error.message || 'Could not update the call.';
        }
      }, error => console.error('Remote call status listener failed:', error));
    }

    async function toggleVideo() {
      if (!peerConnection || !localStream) {
        throw new Error('Wait until the call connects before turning video on.');
      }
      if (isGroupCall && callType !== 'video') {
        throw new Error('Video upgrade is unavailable during a group audio call.');
      }
      if (videoEnabled) {
        if (window.screenShareStream) await toggleScreenShare();
        const currentTrack = localStream.getVideoTracks()[0];
        if (currentTrack) currentTrack.enabled = false;
        videoEnabled = false;
        document.getElementById('localVideo').style.visibility = 'hidden';
        updateVideoControl();
        showConnectedVideoLayout();
        return;
      }

      let videoTrack = localStream.getVideoTracks()[0];
      if (!videoTrack) {
        const cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: 'user' }
        });
        videoTrack = cameraStream.getVideoTracks()[0];
        if (!videoTrack) throw new Error('No camera is available on this device.');
        localStream.addTrack(videoTrack);
        if (localVideoSender) {
          await localVideoSender.replaceTrack(videoTrack);
        } else {
          localVideoSender = peerConnection.addTrack(videoTrack, localStream);
        }
        document.getElementById('localVideo').srcObject = localStream;
      }
      if (!videoTrackNegotiated) {
        try {
          await renegotiateDirectCallForVideo();
          videoTrackNegotiated = true;
        } catch (error) {
          if (localVideoSender) await localVideoSender.replaceTrack(null);
          localStream.removeTrack(videoTrack);
          videoTrack.stop();
          throw error;
        }
      }
      videoTrack.enabled = true;
      videoEnabled = true;
      document.getElementById('localVideo').style.visibility = 'visible';
      updateVideoControl();
      showConnectedVideoLayout();
    }

    async function switchCamera() {
      if (!videoEnabled || !localStream || !peerConnection) return;
      const currentTrack = localStream.getVideoTracks()[0];
      if (!currentTrack) return;
      const nextFacingMode = currentTrack.getSettings().facingMode === 'environment' ? 'user' : 'environment';
      const replacementStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: nextFacingMode } }
      });
      const replacementTrack = replacementStream.getVideoTracks()[0];
      const sender = peerConnection.getSenders().find(item => item.track && item.track.kind === 'video');
      if (sender) await sender.replaceTrack(replacementTrack);
      localVideoSender = sender || localVideoSender;
      currentTrack.stop();
      localStream.removeTrack(currentTrack);
      localStream.addTrack(replacementTrack);
      document.getElementById('localVideo').srcObject = localStream;
    }

    async function toggleScreenShare() {
      if (!peerConnection || !localStream) {
        throw new Error('Wait until the call connects before sharing your screen.');
      }
      if (!localVideoSender) {
        await toggleVideo();
      }
      const videoSender = localVideoSender;
      if (!videoSender) return;
      const currentCameraTrack = localStream.getVideoTracks()[0];
      if (window.screenShareStream) {
        const screenTrack = window.screenShareStream.getVideoTracks()[0];
        await videoSender.replaceTrack(currentCameraTrack);
        screenTrack.stop();
        window.screenShareStream = null;
        document.getElementById('localVideo').srcObject = localStream;
        return;
      }
      const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const screenTrack = screenStream.getVideoTracks()[0];
      window.screenShareStream = screenStream;
      await videoSender.replaceTrack(screenTrack);
      document.getElementById('localVideo').srcObject = screenStream;
      screenTrack.onended = () => {
        toggleScreenShare().catch(error => console.error('Failed to restore camera:', error));
      };
    }

    function showConnectedVideoLayout() {
      const remoteStream = document.getElementById('remoteVideo').srcObject;
      const remoteHasVideo = remoteStream && typeof remoteStream.getVideoTracks === 'function'
        && remoteStream.getVideoTracks().some(track => track.readyState === 'live');
      const videoGrid = document.getElementById('videoGrid');
      if (!videoEnabled && !remoteHasVideo) {
        videoGrid.classList.remove('active', 'connected');
        document.body.classList.remove('video-connected');
        return;
      }
      videoGrid.classList.add('active', 'connected');
      document.body.classList.add('video-connected');
      document.getElementById('localVideo').play().catch(() => {});
      document.getElementById('remoteVideo').play().catch(() => {});
    }

    async function preparePeerConnection(ref) {
      peerConnection = await new RTCPeerConnection(rtcConfig);
      const connection = peerConnection;
      const stream = await openUserMedia();
      stream.getTracks().forEach(track => {
        const sender = peerConnection.addTrack(track, stream);
        if (track.kind === 'video') localVideoSender = sender;
      });
      peerConnection.ontrack = event => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
        if (event.track.kind === 'video') {
          updateVideoControl();
          showConnectedVideoLayout();
        }
      };
      peerConnection.onicecandidate = event => {
        if (event.candidate) ref.collection('candidates').add(event.candidate.toJSON());
      };
      peerConnection.onconnectionstatechange = () => {
        if (remoteDisconnectTimer) {
          clearTimeout(remoteDisconnectTimer);
          remoteDisconnectTimer = null;
        }
        const state = connection.connectionState;
        if (state === 'connected') {
          setCallStatus('Connected', 'success');
        } else if (['failed', 'disconnected', 'closed'].includes(state)) {
          setCallStatus(state === 'disconnected' || state === 'failed' ? 'Call disconnected' : `Call ${state}...`,
            state === 'disconnected' || state === 'failed' ? 'error' : '');
        }
        if (state === 'connected') {
          showConnectedVideoLayout();
          stopConnectingTone();
          stopIncomingTone();
          stopUnansweredCallTimer();
          playConnectedTone();
          startCallTimer();
          startNativeCallNotification();
        } else if (state === 'failed' || state === 'disconnected') {
          remoteDisconnectTimer = setTimeout(() => {
            if (peerConnection !== connection || connection.connectionState !== state || callEnding) return;
            endCall('disconnected');
          }, state === 'failed' ? 0 : 1500);
        }
      };
    }

    function subscribeToCandidates(ref, collectionName) {
      if (candidateUnsubscribe) candidateUnsubscribe();
      candidateUnsubscribe = ref.collection(collectionName).onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type !== 'added' || !peerConnection) return;
          const candidate = change.doc.data();
          peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(error => {
            console.error('Failed to add remote ICE candidate:', error);
          });
        });
      }, error => {
        console.error('ICE candidate listener failed:', error);
      });
    }

    function subscribeToDirectCandidates(ref, collectionName) {
      if (directCandidateUnsubscribe) directCandidateUnsubscribe();
      directCandidateUnsubscribe = ref.collection(collectionName).onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type !== 'added' || !peerConnection) return;
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(error => {
            console.error('Failed to add direct-call ICE candidate:', error);
          });
        });
      }, error => console.error('Direct-call ICE listener failed:', error));
    }

    async function startDirectCall() {
      if (peerConnection || !directCallId) return;
      const authenticatedUser = firebase.auth().currentUser;
      if (!authenticatedUser || !authenticatedUser.email) {
        throw new Error('Please sign in again before starting a call.');
      }
      const targetOnline = await getTargetOnlineState();
      if (targetOnline === false) {
        setCallStatus('Call disconnected', 'error');
        document.getElementById('roomInfo').textContent = 'The other person is offline.';
        document.getElementById('callResultActions').hidden = false;
        await saveCallHistory('disconnected');
        return;
      }
      const callerProfile = await getCurrentCallProfile(authenticatedUser);
      directCallRef = db.collection('calls').doc(directCallId);
      await preparePeerConnection(directCallRef);
      peerConnection.onicecandidate = event => {
        if (event.candidate) directCallRef.collection('callerCandidates').add(event.candidate.toJSON());
      };
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await directCallRef.set({
        callerId: authenticatedUser.email.trim().toLowerCase(),
        callerName: callerProfile.name,
        callerPhoto: callerProfile.photo,
        receiverId: chatEmail.toLowerCase(),
        callType,
        offer: { type: offer.type, sdp: offer.sdp },
        status: 'ringing',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      if (window.sbrymsPush) window.sbrymsPush.send({
        recipient: chatEmail.toLowerCase(),
        type: 'team_call',
        title: `${callType === 'video' ? 'Video' : 'Audio'} call`,
        body: `${localStorage.getItem('currentUserName') || 'A member'} is calling you`,
        callId: directCallId,
        chat: chatEmail.toLowerCase(),
        callType,
        callerName: callerProfile.name,
        senderPhoto: callerProfile.photo
      }).catch(error => console.error('Could not send call push notification:', error));
      db.collection('notifications').add({
        to: chatEmail.toLowerCase(),
        from: authenticatedUser.email.trim().toLowerCase(),
        type: 'team_call',
        title: `${callType === 'video' ? 'Video' : 'Audio'} call`,
        message: `${localStorage.getItem('currentUserName') || 'A member'} is calling you`,
        callId: directCallId,
        callType,
        read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(error => console.error('Failed to create direct-call notification:', error));
      startConnectingTone();
      unansweredCallTimer = setTimeout(autoEndUnansweredCall, 60000);
      subscribeToDirectCandidates(directCallRef, 'receiverCandidates');
      listenToDirectCall(directCallRef);
    }

    async function answerDirectCall() {
      if (peerConnection || !directCallId) return;
      directCallRef = db.collection('calls').doc(directCallId);
      const snapshot = await directCallRef.get();
      const data = snapshot.data();
      if (!snapshot.exists || !data || !data.offer || data.status !== 'ringing') {
        throw new Error('This call is no longer ringing.');
      }
      if (String(data.receiverId || '').trim().toLowerCase() !== currentUserEmail) {
        throw new Error('This call was not sent to your account.');
      }
      if (typeof data.callerPhoto === 'string' && data.callerPhoto.startsWith('https://')) {
        applyMember({
          name: data.callerName || document.getElementById('targetName').textContent,
          email: data.callerId || chatEmail,
          photo: data.callerPhoto
        });
      }
      await preparePeerConnection(directCallRef);
      peerConnection.onicecandidate = event => {
        if (event.candidate) directCallRef.collection('receiverCandidates').add(event.candidate.toJSON());
      };
      subscribeToDirectCandidates(directCallRef, 'callerCandidates');
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await directCallRef.update({
        answer: { type: answer.type, sdp: answer.sdp },
        status: 'connected'
      });
      listenToDirectCall(directCallRef);
      stopConnectingTone();
      stopIncomingTone();
      stopUnansweredCallTimer();
      setCallStatus('Connecting...');
      await startNativeCallNotification();
    }

    function startCallTimer() {
      if (callTimer) return;
      callStartedAt = Date.now();
      document.getElementById('timer').classList.add('is-active');
      callTimer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - callStartedAt) / 1000);
        document.getElementById('timer').textContent =
          `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
      }, 1000);
    }

    function formatCallDuration(totalSeconds) {
      const seconds = Math.max(0, Number(totalSeconds) || 0);
      return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    async function saveCallHistory(outcome = callStartedAt ? 'completed' : 'cancelled') {
      const durationSeconds = callStartedAt ? Math.max(0, Math.floor((Date.now() - callStartedAt) / 1000)) : 0;
      const callConversationId = isGroupCall
        ? 'team_group_chat'
        : [currentUserEmail, chatEmail.toLowerCase()].filter(Boolean).sort().join('__');
      if (!callConversationId || !currentUserEmail || (!isGroupCall && callRole !== 'caller') || callHistorySaved) return;
      callHistorySaved = true;
      const conversationRef = db.collection('team_meet_conversations').doc(callConversationId);
      const outcomeLabels = {
        busy: 'Busy',
        disconnected: 'Call disconnected',
        received: 'Incoming call received',
        completed: 'Call connected',
        'no-answer': 'No answer',
        cancelled: 'Call ended'
      };
      const historyMessage = {
        id: `call-history-${directCallId || Date.now()}-${Math.random().toString(16).slice(2)}`,
        callId: directCallId || '',
        sender: 'me',
        senderEmail: currentUserEmail,
        senderName: 'You',
        self: true,
        callerId: currentUserEmail,
        receiverId: isGroupCall ? '' : chatEmail.toLowerCase(),
        type: 'call-history',
        outcome,
        callType,
        durationSeconds,
        duration: formatCallDuration(durationSeconds),
        text: outcomeLabels[outcome] || outcomeLabels.cancelled,
        createdAt: new Date().toISOString(),
        time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
        reactions: {}
      };
      try {
        const localStorageKey = isGroupCall
          ? 'team_meet_group_chat'
          : `team_meet_chat_${[currentUserEmail, chatEmail.toLowerCase()].filter(Boolean).sort().join('__')}`;
        let localMessages = [];
        try {
          const storedMessages = JSON.parse(localStorage.getItem(localStorageKey) || '[]');
          localMessages = Array.isArray(storedMessages) ? storedMessages : [];
        } catch (storageError) {
          console.error('Failed to read local call history:', storageError);
        }
        if (!localMessages.some(message => message.callId && message.callId === historyMessage.callId)) {
          localStorage.setItem(localStorageKey, JSON.stringify([...localMessages, historyMessage]));
        }
        const recentMessages = [...localMessages, historyMessage].slice(-100).map(message => ({
          id: String(message.id || ''),
          sender: message.sender || '',
          senderEmail: message.senderEmail || '',
          senderName: message.senderName || '',
          self: message.self === true,
          status: message.status || 'sent',
          text: String(message.text || '').slice(0, 180),
          attachment: message.type === 'attachment' || Boolean(message.attachment || message.attachments),
          type: message.type || 'text',
          deleted: message.deleted === true,
          createdAt: message.createdAt || message.timestamp || message.date || null,
          time: message.time || ''
        }));
        await Promise.all([
          db.collection('team_meet_messages_shared').doc(`${callConversationId}__${historyMessage.id}`).set({
            conversationId: callConversationId,
            messageId: historyMessage.id,
            message: historyMessage,
            updatedAt: new Date()
          }),
          conversationRef.set({
            conversationId: callConversationId,
            participants: [currentUserEmail, chatEmail.toLowerCase()].filter(Boolean),
            messages: recentMessages,
            updatedAt: new Date()
          }, { merge: true })
        ]);
      } catch (error) {
        callHistorySaved = false;
        console.error('Failed to save call history:', error);
      }
    }

    async function createRoom() {
      if (peerConnection) return;
      if (!initialRoomId) throw new Error('This call link is invalid. Start a new call from Team Meet.');
      roomRef = db.collection('rooms').doc(initialRoomId);
      document.getElementById('roomInfo').textContent = 'Connecting to the group call...';
      await preparePeerConnection(roomRef);
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await roomRef.set({ offer: { type: offer.type, sdp: offer.sdp }, createdAt: new Date() });
      startConnectingTone();
      subscribeToCandidates(roomRef, 'receiverCandidates');
      roomUnsubscribe = roomRef.onSnapshot(async snapshot => {
        const data = snapshot.data();
        if (data && data.answer && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          setCallStatus('Connecting...');
        }
      });
    }

    async function joinRoom() {
      if (peerConnection) return;
      if (!initialRoomId) throw new Error('This call link is invalid. Open the invitation from Team Meet.');
      roomRef = db.collection('rooms').doc(initialRoomId);
      const snapshot = await roomRef.get();
      const data = snapshot.data();
      if (!snapshot.exists || !data || !data.offer) {
        document.getElementById('roomInfo').textContent = 'Room not found.';
        return;
      }
      await preparePeerConnection(roomRef);
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      subscribeToCandidates(roomRef, 'callerCandidates');
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await roomRef.update({ answer: { type: answer.type, sdp: answer.sdp } });
      setCallStatus('Connecting...');
    }

    document.querySelector('[aria-label="Mute"]').addEventListener('click', async event => {
      try {
        const stream = await openUserMedia();
        const track = stream.getAudioTracks()[0];
        if (track) {
          track.enabled = !track.enabled;
          event.currentTarget.classList.toggle('is-active', !track.enabled);
          event.currentTarget.setAttribute('aria-label', track.enabled ? 'Mute' : 'Unmute');
          event.currentTarget.querySelector('.control-label').textContent = track.enabled ? 'Mute' : 'Unmute';
          event.currentTarget.title = track.enabled ? 'Mute microphone' : 'Unmute microphone';
        }
      } catch (error) {
        console.error('Could not change microphone state:', error);
        document.getElementById('roomInfo').textContent = error.message || 'Microphone access is unavailable.';
      }
    });

    document.querySelector('[aria-label="Audio"]').addEventListener('click', event => {
      const remoteVideo = document.getElementById('remoteVideo');
      remoteVideo.muted = !remoteVideo.muted;
      event.currentTarget.classList.toggle('is-active', !remoteVideo.muted);
      event.currentTarget.setAttribute('aria-label', remoteVideo.muted ? 'Audio off' : 'Audio on');
      event.currentTarget.querySelector('.control-label').textContent = remoteVideo.muted ? 'Audio off' : 'Audio';
      event.currentTarget.title = remoteVideo.muted ? 'Turn incoming call audio on' : 'Turn incoming call audio off';
    });

    document.getElementById('toggleVideoButton').addEventListener('click', () => {
      toggleVideo().catch(error => {
        console.error('Could not change video state:', error);
        document.getElementById('roomInfo').textContent = error.message || 'Video is unavailable.';
      });
    });
    document.querySelector('[aria-label="Camera switch"]').addEventListener('click', () => {
      switchCamera().catch(error => {
        console.error('Camera switch failed:', error);
        document.getElementById('roomInfo').textContent = error.message || 'Camera switching is unavailable.';
      });
    });
    document.querySelector('[aria-label="Share screen"]').addEventListener('click', () => {
      toggleScreenShare().catch(error => {
        console.error('Screen sharing failed:', error);
        document.getElementById('roomInfo').textContent = error.message || 'Screen sharing is unavailable.';
      });
    });
    document.getElementById('moreCallControls').addEventListener('click', event => {
      const menu = document.getElementById('moreCallMenu');
      const isExpanded = event.currentTarget.getAttribute('aria-expanded') === 'true';
      event.currentTarget.setAttribute('aria-expanded', String(!isExpanded));
      menu.hidden = isExpanded;
    });
    async function endCall(reason = '') {
      if (callEnding) return;
      callEnding = true;
      stopConnectingTone();
      stopIncomingTone();
      stopUnansweredCallTimer();
      if (remoteDisconnectTimer) {
        clearTimeout(remoteDisconnectTimer);
        remoteDisconnectTimer = null;
      }
      if (callTimer) {
        clearInterval(callTimer);
        callTimer = null;
      }
      stopNativeCallNotification();
      if (roomUnsubscribe) roomUnsubscribe();
      if (candidateUnsubscribe) candidateUnsubscribe();
      if (!directCallRef && directCallId && !isGroupCall && callRole === 'callee') {
        directCallRef = db.collection('calls').doc(directCallId);
      }
      if (directCallUnsubscribe) directCallUnsubscribe();
      if (directCandidateUnsubscribe) directCandidateUnsubscribe();
      if (peerConnection) peerConnection.close();
      peerConnection = null;
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      localStream = null;
      if (window.screenShareStream) {
        window.screenShareStream.getTracks().forEach(track => track.stop());
        window.screenShareStream = null;
      }
      const endedReason = reason || (callStartedAt
        ? 'completed'
        : callRole === 'callee' && directCallId
          ? 'rejected'
          : 'cancelled');
      const callOutcome = reason === 'disconnected'
        ? 'disconnected'
        : endedReason === 'rejected'
          ? 'busy'
          : callStartedAt
            ? 'completed'
            : 'cancelled';
      if (directCallRef) {
        await directCallRef.update({
          status: 'ended',
          endedReason,
          endedBy: currentUserEmail
        }).catch(error => console.error('Failed to notify the other member that the call ended:', error));
      }
      await saveCallHistory(callOutcome);
      window.location.href = 'team-meet-chat.html#chat=' + encodeURIComponent(chatEmail);
    }

    document.getElementById('callBackButton').addEventListener('click', handleCallBack);
    document.querySelector('[aria-label="End call"]').addEventListener('click', () => endCall());
    document.getElementById('retryCallButton').addEventListener('click', () => {
      const nextCallId = `call-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const retryUrl = new URL('team-meet-call.html', window.location.href);
      retryUrl.search = new URLSearchParams({
        chat: chatEmail,
        call: nextCallId,
        role: 'caller',
        type: callType
      }).toString();
      window.location.replace(retryUrl.href);
    });
    document.getElementById('messageAfterCallButton').addEventListener('click', () => {
      window.location.href = 'team-meet-chat.html#chat=' + encodeURIComponent(chatEmail);
    });

    async function initializeCall() {
      const authenticatedUser = await new Promise(resolve => {
        let unsubscribe = () => {};
        unsubscribe = firebase.auth().onAuthStateChanged(user => {
          unsubscribe();
          resolve(user);
        });
      });

      if (!authenticatedUser || !authenticatedUser.email) {
        setCallStatus('Sign in required', 'error');
        document.getElementById('roomInfo').textContent = 'Please sign in from the login page before starting a call.';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1800);
        return;
      }

      currentUserEmail = authenticatedUser.email.trim().toLowerCase();
      localStorage.setItem('currentUserEmail', currentUserEmail);
      localStorage.setItem('currentUserUid', authenticatedUser.uid || '');
      loadMemberFromFirestore();

      if (isGroupCall && directCallId && !initialRoomId) {
        const groupCallSnapshot = await db.collection('calls').doc(directCallId).get();
        const groupCall = groupCallSnapshot.data();
        if (!groupCallSnapshot.exists || !groupCall || !groupCall.roomId) {
          throw new Error('This group call has expired or is no longer available.');
        }
        initialRoomId = String(groupCall.roomId).trim();
        autoJoin = Boolean(initialRoomId);
      }

      if (params.get('action') === 'decline' && directCallId) {
        stopConnectingTone();
        stopIncomingTone();
        try {
          await db.collection('calls').doc(directCallId).update({
            status: 'ended',
            endedReason: 'declined'
          });
          setCallStatus('Call declined', 'error');
          setTimeout(() => window.location.replace('team-meet.html'), 700);
        } catch (error) {
          console.error('Could not decline the incoming call:', error);
          setCallStatus('Could not decline the call', 'error');
          document.getElementById('roomInfo').textContent = error.message || 'Please try again.';
        }
        return;
      }

      if (params.get('action') === 'end' && directCallId) {
        await db.collection('calls').doc(directCallId).update({
          status: 'ended',
          endedReason: 'completed',
          endedBy: currentUserEmail
        });
        stopNativeCallNotification();
        window.location.replace('team-meet-chat.html#chat=' + encodeURIComponent(chatEmail));
        return;
      }

      if (!isGroupCall && directCallId) {
        if (callRole === 'caller') {
          setCallStatus('Calling...');
        } else {
          setCallStatus('Answering...');
        }
        const directAction = callRole === 'caller' ? startDirectCall() : answerDirectCall();
        directAction.catch(error => {
        console.error('Direct call setup failed:', error);
        stopNativeCallNotification();
        stopConnectingTone();
        stopIncomingTone();
        stopUnansweredCallTimer();
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        const isMediaPermissionError = ['NotAllowedError', 'PermissionDeniedError', 'NotFoundError'].includes(error.name);
        const isFirestorePermissionError = error.code === 'permission-denied'
          || /missing or insufficient permissions/i.test(error.message || '');
        setCallStatus(isMediaPermissionError
          ? 'Microphone permission is required'
          : isFirestorePermissionError
            ? 'Call permission is not available'
            : 'Call could not connect', 'error');
        document.getElementById('roomInfo').textContent = isMediaPermissionError
          ? 'Allow microphone access in your browser, then try again.'
          : isFirestorePermissionError
            ? 'Please sign in again or update Firebase calls permissions.'
            : (error.message || 'Please try again.');
        });
      } else if (autoJoin) {
        const joinAction = callRole === 'caller' ? createRoom() : joinRoom();
        joinAction.catch(error => {
          console.error('Automatic room join failed:', error);
          document.getElementById('roomInfo').textContent = 'Could not join this call room.';
        });
      }
    }

    initializeCall().catch(error => {
      console.error('Call initialization failed:', error);
      setCallStatus('Call could not start', 'error');
      document.getElementById('roomInfo').textContent = error.message || 'Please try again.';
    });
  </script>
  <script src="assets/push-notifications.js"></script>
  <script src="assets/device-sessions.js"></script>
</body>
