        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; }

        .row-action button { margin-right: 6px; padding: 7px 10px; border: none; border-radius: 12px; cursor: pointer; font-size: 12px; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-save { background: #10b981; color: white; }
        .btn-cancel { background: #9ca3af; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        input, select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 14px; }
        .empty-state { text-align: center; padding: 32px 0; color: #6b7280; }
    </style>

<body>
    <div class="page-header">
        <div>
            <a href="FACE APP.html">←</a>
            <div style="display:inline-block; vertical-align: middle; margin-left: 12px;">
                <h1 class="page-title">Security</h1>
                <p class="subtitle">সিকিউরিটি সেটিংস এডিট এবং দেখুন</p>
            </div>
        </div>
        <button class="btn-add" onclick="addRow()">নতুন সেটিং যোগ করুন</button>
    </div>

    <div class="content">
        <div class="summary-card">
            <div class="summary-grid">
                <div class="stat-box">
                    <div class="stat-title">মোট সেটিংস</div>
                    <div class="stat-value" id="totalSettings">৩</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">সক্রিয়</div>
                    <div class="stat-value" id="enabledSettings">২</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">নিষ্ক্রিয়</div>
                    <div class="stat-value" id="disabledSettings">১</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">শেষ আপডেট</div>
                    <div class="stat-value" id="lastUpdate">২০২৪-০৩-০৫</div>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="action-bar">
                <span>সিকিউরিটি সেটিংসের তথ্য</span>
                <button class="btn-refresh" onclick="renderTable()">রিফ্রেশ</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ফিচার</th>
                        <th>বর্ণনা</th>
                        <th>স্ট্যাটাস</th>
                        <th>লেভেল</th>
                        <th>শেষ পরিবর্তন</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="securityBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">কোনো সেটিংস নেই, নতুন যোগ করুন।</div>
        </div>
    </div>

    <script>
        const securityData = [
            { feature: 'Two-Factor Authentication', description: 'Extra security layer', status: 'Enabled', level: 'High', lastChange: '2024-01-15' },
            { feature: 'Biometric Login', description: 'Fingerprint/Face ID', status: 'Enabled', level: 'Medium', lastChange: '2024-02-10' },
            { feature: 'Auto Logout', description: 'Automatic session timeout', status: 'Disabled', level: 'Low', lastChange: '2024-03-05' }
        ];
        let editIndex = null;

        function renderTable() {
            const tbody = document.getElementById('securityBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (securityData.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            securityData.forEach((row, index) => {
                const tr = document.createElement('tr');

                if (editIndex === index) {
                    tr.innerHTML = `
                        <td><input type="text" value="${row.feature}" id="feature-${index}"></td>
                        <td><input type="text" value="${row.description}" id="description-${index}"></td>
                        <td>
                            <select id="status-${index}">
                                <option value="Enabled" ${row.status === 'Enabled' ? 'selected' : ''}>Enabled</option>
                                <option value="Disabled" ${row.status === 'Disabled' ? 'selected' : ''}>Disabled</option>
                            </select>
                        </td>
                        <td>
                            <select id="level-${index}">
                                <option value="High" ${row.level === 'High' ? 'selected' : ''}>High</option>
                                <option value="Medium" ${row.level === 'Medium' ? 'selected' : ''}>Medium</option>
                                <option value="Low" ${row.level === 'Low' ? 'selected' : ''}>Low</option>
                            </select>
                        </td>
                        <td><input type="date" value="${row.lastChange}" id="lastChange-${index}"></td>
                        <td class="row-action">
                            <button class="btn-save" onclick="saveRow(${index})">Save</button>
                            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                        </td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${row.feature}</td>
                        <td>${row.description}</td>
                        <td><span class="tag ${row.status === 'Enabled' ? 'tag-enabled' : 'tag-disabled'}">${row.status}</span></td>
                        <td>${row.level}</td>
                        <td>${row.lastChange}</td>
                        <td class="row-action">
                            <button class="btn-edit" onclick="editRow(${index})">Edit</button>
                            <button class="btn-delete" onclick="deleteRow(${index})">Delete</button>
                        </td>
                    `;
                }

                tbody.appendChild(tr);
            });

            updateSummary();
        }

        function updateSummary() {
            const totalSettings = securityData.length;
            const enabledSettings = securityData.filter(row => row.status === 'Enabled').length;
            const disabledSettings = securityData.filter(row => row.status === 'Disabled').length;
            const lastUpdate = securityData.reduce((latest, row) => row.lastChange > latest ? row.lastChange : latest, '2024-01-01');

            document.getElementById('totalSettings').innerText = totalSettings;
            document.getElementById('enabledSettings').innerText = enabledSettings;
            document.getElementById('disabledSettings').innerText = disabledSettings;
            document.getElementById('lastUpdate').innerText = lastUpdate;
        }

        function editRow(index) {
            editIndex = index;
            renderTable();
        }

        function cancelEdit() {
            editIndex = null;
            renderTable();
        }

        function saveRow(index) {
            const feature = document.getElementById(`feature-${index}`).value.trim();
            const description = document.getElementById(`description-${index}`).value.trim();
            const status = document.getElementById(`status-${index}`).value;
            const level = document.getElementById(`level-${index}`).value;
            const lastChange = document.getElementById(`lastChange-${index}`).value;

            if (!feature || !description) {
                alert('ফিচার এবং বর্ণনা পূরণ করুন।');
                return;
            }

            securityData[index] = { feature, description, status, level, lastChange };
            editIndex = null;
            renderTable();
        }

        function deleteRow(index) {
            if (!confirm('এই সেটিং মুছে ফেলতে চান?')) return;
            securityData.splice(index, 1);
            if (editIndex === index) editIndex = null;
            renderTable();
        }

        function addRow() {
            securityData.push({ feature: 'New Feature', description: 'Feature description', status: 'Disabled', level: 'Low', lastChange: new Date().toISOString().split('T')[0] });
            editIndex = securityData.length - 1;
            renderTable();
        }

        renderTable();
    </script>
